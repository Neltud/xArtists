# Root virtual workspace — MultiversX SC crates each define their OWN [workspace]
# (members = [".", "meta"]). They must NOT be listed as members here or cargo fails with:
#   error: multiple workspace roots found in the same workspace
#
# Full wasm builds: Actions deploy-* workflows (sc-meta), not host cargo check.

[workspace]
members = []
exclude = [
    "contracts/nft-staking",
    "contracts/nft-staking/meta",
    "contracts/tro-staking",
    "contracts/tro-staking/meta",
    "contracts/venue_split",
    "contracts/venue_split/meta",
    "contracts/nft-marketplace",
    "contracts/nft-marketplace/meta",
    "contracts/agents-marketplace",
    "contracts/agents-marketplace/meta",
    "contracts/slot-casino",
    "contracts/slot-casino/meta",
    "contracts/treasury-splitter",
    "contracts/treasury-splitter/meta",
    "contracts/tro-governance",
    "contracts/tro-governance/meta",
    "contracts/agent-stake-escrow",
    "contracts/agent-stake-escrow/meta",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Nelson Tuduri <nelson@xartists.com>"]
license = "MIT"
repository = "https://github.com/Neltud/xArtists"
homepage = "https://xartists.com"
keywords = ["art", "nft", "staking", "multiversx", "dao"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
