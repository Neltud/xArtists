# Local professional stack (P4.5)
# Usage: docker compose up --build
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_BASE=/

  data-tick:
    image: python:3.11-slim
    working_dir: /repo
    volumes:
      - .:/repo
    command: >
      sh -c "pip install -q pyyaml &&
      while true; do
        PYTHONPATH=. python -m lia.guardian.onchain_monitor || true;
        PYTHONPATH=. python -m lia.shadow.sprint || true;
        PYTHONPATH=. python -m lia.guardian.kill_switch || true;
        sleep 120;
      done"
    environment:
      - LIA_LIVE_TRADING=0
