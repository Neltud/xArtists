# xArtists local stack — one command
# docker compose up --build
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_BASE=/

  data-tick:
    image: python:3.11-slim
    working_dir: /repo
    volumes:
      - .:/repo
    command: >
      sh -c "pip install -q pyyaml &&
      while true; do
        PYTHONPATH=. python -m lia.genesis.tick || true;
        PYTHONPATH=. python -m lia.guardian.yield_distributor --cycle || true;
        sleep 180;
      done"
    environment:
      - LIA_LIVE_TRADING=0

volumes:
  frontend_node_modules:
