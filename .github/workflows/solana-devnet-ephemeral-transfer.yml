name: Solana Devnet ephemeral 1000-lamport transfer (no real SOL)

# Separate from PayBox and mint workflows; no repo / deployment secrets.
# May only run on first-party PRs or deliberate main workflow_dispatch.
on:
  pull_request:
    paths:
      - 'scripts/ops/solana_devnet_micro_transfer.mjs'
      - '.github/workflows/solana-devnet-ephemeral-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xartists-one-devnet-sol-micro-transfer
  cancel-in-progress: false

jobs:
  ephemeral-devnet-sol:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      XARTISTS_ALLOW_DEVNET_SEND: '1'
      PAYBOX_CHECKOUT_ENABLED: '0'
      MINT_DISPATCH_ENABLED: '0'
      MINT_LIVE_ENABLED: '0'
      LIA_LIVE_TRADING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate zero-dependency devnet-only code
        run: node --check scripts/ops/solana_devnet_micro_transfer.mjs
      - name: Faucet-funded single 1000-lamport Solana Devnet transfer
        run: node scripts/ops/solana_devnet_micro_transfer.mjs
