name: Marketplace user listing safety — read only preflight
on:
  pull_request:
    paths:
      - 'apps/frontend/src/components/MyOwnedNftsPanel.tsx'
      - 'apps/frontend/src/config/scStatus.ts'
      - 'apps/frontend/src/lib/scStatus.ts'
      - 'apps/frontend/src/hooks/useMarketplaceReadiness.ts'
      - 'apps/frontend/src/hooks/useMarketplaceTx.ts'
      - 'apps/frontend/tests/marketplace-seller-only-unlock.test.mjs'
      - 'apps/frontend/src/components/ListNftSheet.tsx'
      - 'apps/frontend/src/pages/MarketplacePage.tsx'
      - 'apps/frontend/src/lib/marketplaceUserListing.mjs'
      - 'apps/frontend/tests/marketplace-user-listing-gate.test.mjs'
      - 'apps/frontend/tests/marketplace-listing-interaction.test.mjs'
      - '.github/workflows/marketplace-user-listing-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Read-only listing validator and source gates
        run: node --test apps/frontend/tests/marketplace-user-listing-gate.test.mjs apps/frontend/tests/marketplace-seller-only-unlock.test.mjs
      - name: Install frontend interaction-test dependencies
        run: npm ci --prefix apps/frontend --legacy-peer-deps --ignore-scripts
      - name: Exercise 100-NFT selection, cancellation and real transaction hook with a fake signer
        run: node --test apps/frontend/tests/marketplace-listing-interaction.test.mjs

  mainnet-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Revalidate independent read-only marketplace inspector
        run: node --test scripts/ops/inspect-marketplace-mainnet.test.mjs
      - name: Offline sale receipt scan regression
        run: node --test scripts/ops/scan-marketplace-sale-proof.test.mjs
      - name: Observe buyer receipt after a successful historical listing (no wallet)
        run: node scripts/ops/scan-marketplace-sale-proof.mjs
      - name: Verify production codeHash, payable, pause, fees and listing views (no transactions)
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import {inspectMarketplace} from './scripts/ops/inspect-marketplace-mainnet.mjs'
          const registry=JSON.parse(readFileSync('data/contracts.json','utf8'))
          const result=await inspectMarketplace({registry,maxListings:8})
          console.log(JSON.stringify({
            network:result.network,contract:result.address,
            codehashMatchesRegistry:result.codehashMatchesRegistry,
            payable:result.payable,paused:result.paused,feeBps:result.feeBps,
            inspectedListings:result.listings.length,
            activeListingIds:result.activeListings.map(item=>item.id),
            checkedAt:new Date().toISOString(),
            note:'Read-only observation; no completed sale or buyer delivery is inferred'
          }))
          if(result.paused)throw Error('Marketplace paused — NO GO')
          NODE

      - name: Observe actual seller preflight on two public project-associated NFT samples (no signature)
        run: |
          node --input-type=module <<'NODE'
          import {verifyUserNftListPreflight} from './apps/frontend/src/lib/marketplaceUserListing.mjs'
          import {inspectMarketplace} from './scripts/ops/inspect-marketplace-mainnet.mjs'
          import {readFileSync} from 'node:fs'
          const registry=JSON.parse(readFileSync('data/contracts.json','utf8'))
          const market=await inspectMarketplace({registry,maxListings:2})
          // Public historical seller address, documented in #428. No keys or wallet session.
          const address='erd1mmh2j5y8esv2tmmyeau3hr4xa2u2te3zc3j9wumn3v5vm8uvsczqnucj5l'
          for(const [identifier,collection,nonce] of [
            ['AGR-9bd53e-02','AGR-9bd53e',2],
            ['ALISTOR-a646bc-01','ALISTOR-a646bc',1],
          ]){
            const url='https://api.multiversx.com/accounts/'+address+'/nfts/'+identifier
            const res=await fetch(url,{signal:AbortSignal.timeout(10000),cache:'no-store',redirect:'error'})
            if(res.status===404){console.log(JSON.stringify({identifier,status:'skipped_ownership_changed'}));continue}
            if(!res.ok)throw Error('Live sample ownership HTTP '+res.status)
            const owned=await res.json()
            if(!owned||owned.identifier!==identifier||!/^\d+$/.test(String(owned.balance))||BigInt(owned.balance)<1n){
              console.log(JSON.stringify({identifier,status:'skipped_ownership_changed'}));continue
            }
            const metaRes=await fetch('https://api.multiversx.com/nfts/'+identifier,{signal:AbortSignal.timeout(10000),cache:'no-store',redirect:'error'})
            if(!metaRes.ok)throw Error('Live sample metadata HTTP '+metaRes.status)
            const meta=await metaRes.json()
            const royaltyBps=Math.round(Number(meta.royalties)*100)
            if(!Number.isInteger(royaltyBps)||royaltyBps<0||royaltyBps>10000)throw Error('Invalid live sample royalty')
            const blocked=market.feeBps+royaltyBps>1000
            let proof
            try{proof=await verifyUserNftListPreflight({address,identifier,collection,nonce})}
            catch(err){
              if(blocked&&String(err.message).includes('Le contrat limite le total à 10 %')){
                console.log(JSON.stringify({identifier,status:'correctly_blocked_by_cap',feeBps:market.feeBps,royaltyBps}));continue
              }
              throw err
            }
            if(blocked||proof.feeBps!==market.feeBps||proof.royaltyBps!==royaltyBps)throw Error('Live sample preflight mismatch')
            console.log(JSON.stringify({identifier,status:'preflight_verified_read_only',feeBps:proof.feeBps,royaltyBps:proof.royaltyBps}))
          }
          NODE
