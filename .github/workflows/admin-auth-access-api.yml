name: Admin auth access-api paper tests

on:
  pull_request:
    paths:
      - 'services/access-api/src/adminAuth*.mjs'
      - 'services/access-api/tests/admin-auth*.test.mjs'
      - 'services/access-api/migrations/006_admin_auth_challenges_v1.sql'
      - '.github/workflows/admin-auth-access-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-auth-access-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xartists_ci
          POSTGRES_PASSWORD: ci_only_ephemeral
          POSTGRES_DB: xartists_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xartists_ci -d xartists_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable CI database only. Never point this job at production/Neon.
      ADMIN_AUTH_TEST_DATABASE_URL: postgres://xartists_ci:ci_only_ephemeral@localhost:5432/xartists_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install lockfile-pinned SDK for offline MultiversX protocol verification
        working-directory: services/access-api
        run: npm ci --ignore-scripts
      - name: Unit tests (no production DB, no HTTP admin route)
        working-directory: services/access-api
        run: >-
          node --test
          tests/admin-auth-session-binding.test.mjs
          tests/admin-auth-challenge-store-unit.test.mjs
          tests/admin-auth-challenge-pg.test.mjs
          tests/admin-auth-wallet-sdk.test.mjs
          tests/admin-auth-proof-redemption.test.mjs
          tests/admin-auth-proof-pg.test.mjs
