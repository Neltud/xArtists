name: Microtest tro-staking stake dust

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_STAKE"
        default: ""
        type: string
      amount_atomic:
        description: "TRO amount atomic (6 decimals, 1000000 = 1 TRO)"
        default: "1000000"
        type: string

permissions:
  contents: read

jobs:
  stake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}
      DEPLOYER: erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g
      TRO_STAKING: erd1qqqqqqqqqqqqqpgqqpc9064q0t33dasd23k2hm36fu5gqp7mvhxq9xvpwf
      TRO_TOKEN: TRO-94c925
      PROXY: https://gateway.multiversx.com
      CHAIN_ID: "1"
      AMOUNT: ${{ github.event.inputs.amount_atomic }}

    steps:
      - name: Gate
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RUN_STAKE" ]; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install multiversx-sdk-cli
      - name: PEM
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d '\n' < "${RUNNER_TEMP}/deployer.pem")
            { echo "-----BEGIN PRIVATE KEY for deployer-----"; echo "$HEX" | fold -w 64; echo "-----END PRIVATE KEY for deployer-----"; } > "${RUNNER_TEMP}/deployer.pem"
          fi
      - name: stake TRO dust
        run: |
          set -euo pipefail
          NONCE=$(curl -s "https://api.multiversx.com/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          echo "nonce=$NONCE amount=$AMOUNT"
          # Try modern token-transfers first; fallback ESDTTransfer data
          set +e
          OUT=$(mxpy contract call "$TRO_STAKING" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --function stake \
            --token-transfers "${TRO_TOKEN}@${AMOUNT}" \
            --gas-limit 15000000 \
            --proxy "$PROXY" --chain "$CHAIN_ID" \
            --nonce "$NONCE" \
            --send --wait-result 2>&1)
          RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "token-transfers failed rc=$RC — retry ESDTTransfer data"
            NONCE=$(curl -s "https://api.multiversx.com/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
            TOKEN_HEX=$(printf '%s' "$TRO_TOKEN" | xxd -p -c 256)
            AMT_HEX=$(python3 -c "print(format(int('${AMOUNT}'),'x'))")
            FUNC_HEX=$(printf 'stake' | xxd -p -c 256)
            DATA="ESDTTransfer@${TOKEN_HEX}@${AMT_HEX}@${FUNC_HEX}"
            mxpy tx new \
              --pem="${RUNNER_TEMP}/deployer.pem" \
              --receiver "$TRO_STAKING" \
              --data "$DATA" \
              --gas-limit 15000000 \
              --proxy "$PROXY" --chain "$CHAIN_ID" \
              --nonce "$NONCE" \
              --send --wait-result
          fi
          set -e
      - name: Verify getTotalStaked
        run: |
          python3 <<'PY'
          import urllib.request, json, base64, time
          time.sleep(3)
          ADDR="erd1qqqqqqqqqqqqqpgqqpc9064q0t33dasd23k2hm36fu5gqp7mvhxq9xvpwf"
          body=json.dumps({"scAddress":ADDR,"funcName":"getTotalStaked","args":[]}).encode()
          req=urllib.request.Request("https://api.multiversx.com/vm-values/query", data=body, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req) as r:
              d=json.load(r)
          rd=(d.get("data") or {}).get("data") or {}
          raw=rd.get("returnData") or []
          total = int.from_bytes(base64.b64decode(raw[0]), "big") if raw and raw[0] else 0
          print("totalStaked_atomic", total)
          print("totalStaked_TRO", total / 1e6)
          if total < 1:
              raise SystemExit("stake not recorded on-chain")
          PY
      - if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
