name: Public offers route and safety checks

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/public-offers-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:release
      - run: npm run check:routes
      - run: npm run typecheck
      - run: npm run build
