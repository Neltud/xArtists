name: Deploy agents-marketplace

# Uses secret SC_DEPLOYER_PEM (never logged). Supports deploy OR upgrade of buyPack bytecode.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy = new SC · upgrade = update existing mainnet agents-marketplace"
        required: true
        default: "upgrade"
        type: choice
        options: ["upgrade", "deploy"]
      chain:
        description: "D=devnet, 1=mainnet"
        required: true
        default: "1"
        type: choice
        options: ["D", "1"]
      confirm_mainnet:
        description: "Mainnet — type exactly DEPLOY_MAINNET"
        required: false
        default: ""
        type: string
      fee_bps:
        description: "Init fee bps (deploy mode only)"
        required: true
        default: "300"
        type: string
      contract_address:
        description: "SC address (upgrade mode). Default = mainnet agents-marketplace"
        required: false
        default: "erd1qqqqqqqqqqqqqpgqgawa0p5y09f0e68pwaa50zm47jl9jxcwvhxqgdqwsg"
        type: string
      col_pulse:
        description: "Optional full collection id Pulse (setPackCollection 0x01 after upgrade)"
        required: false
        default: ""
        type: string
      col_yield:
        description: "Optional full collection id Yield (0x02)"
        required: false
        default: ""
        type: string
      col_sentinel:
        description: "Optional full collection id Sentinel (0x03)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHAIN_ID: ${{ github.event.inputs.chain }}
      FEE_BPS: ${{ github.event.inputs.fee_bps }}
      MODE: ${{ github.event.inputs.mode }}
      CONTRACT_ADDRESS: ${{ github.event.inputs.contract_address }}
      COL_PULSE: ${{ github.event.inputs.col_pulse }}
      COL_YIELD: ${{ github.event.inputs.col_yield }}
      COL_SENTINEL: ${{ github.event.inputs.col_sentinel }}
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}

    steps:
      - uses: actions/checkout@v4

      - name: Mainnet gate
        run: |
          if [ "${CHAIN_ID}" = "1" ] && [ "${{ github.event.inputs.confirm_mainnet }}" != "DEPLOY_MAINNET" ]; then
            echo "MAINNET blocked — set confirm_mainnet=DEPLOY_MAINNET"
            exit 1
          fi
          if [ "${CHAIN_ID}" = "1" ]; then
            echo "PROXY=https://gateway.multiversx.com" >> "$GITHUB_ENV"
            echo "API=https://api.multiversx.com" >> "$GITHUB_ENV"
          else
            echo "PROXY=https://devnet-gateway.multiversx.com" >> "$GITHUB_ENV"
            echo "API=https://devnet-api.multiversx.com" >> "$GITHUB_ENV"
          fi
          echo "MODE=${MODE} CHAIN=${CHAIN_ID}"

      - name: Write PEM from SC_DEPLOYER_PEM
        run: |
          set -euo pipefail
          if [ -z "${SC_DEPLOYER_PEM:-}" ]; then
            echo "Secret SC_DEPLOYER_PEM is empty or missing"
            exit 1
          fi
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d ' \n' < "${RUNNER_TEMP}/deployer.pem")
            {
              echo "-----BEGIN PRIVATE KEY for deployer-----"
              echo "$HEX" | fold -w 64
              echo "-----END PRIVATE KEY for deployer-----"
            } > "${RUNNER_TEMP}/deployer.pem"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install multiversx-sdk-cli multiversx-sdk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build agents wasm
        working-directory: contracts/agents-marketplace
        run: |
          set -euo pipefail
          cargo install multiversx-sc-meta --locked --force || cargo install multiversx-sc-meta --force || true
          sc-meta all build || true
          WASM=$(find . -name '*.wasm' ! -path '*/deps/*' | head -1 || true)
          if [ -z "$WASM" ]; then
            echo "sc-meta no wasm — try wasm crate"
            if [ -d wasm ]; then
              cd wasm
              cargo build --release --target wasm32-unknown-unknown || true
              WASM=$(find target -name '*.wasm' | head -1 || true)
              cd ..
            fi
          fi
          test -n "$WASM" || { echo "No wasm produced"; exit 1; }
          ABS="$(cd "$(dirname "$WASM")" && pwd)/$(basename "$WASM")"
          echo "AGENTS_WASM=$ABS" >> "$GITHUB_ENV"
          echo "wasm=$ABS size=$(wc -c < "$ABS")"

      - name: Upgrade existing SC
        if: env.MODE == 'upgrade'
        run: |
          set -euo pipefail
          echo "Upgrading ${CONTRACT_ADDRESS}"
          OWNER=$(curl -sS "${API}/accounts/${CONTRACT_ADDRESS}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ownerAddress',''))")
          echo "onchain_owner=$OWNER"
          NONCE=$(curl -sS "${API}/accounts/${OWNER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          echo "deployer_nonce=$NONCE"
          LOG=$(mxpy contract upgrade "${CONTRACT_ADDRESS}" \
            --bytecode="${AGENTS_WASM}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --gas-limit=60000000 \
            --proxy="${PROXY}" \
            --chain="${CHAIN_ID}" \
            --nonce="$NONCE" \
            --send \
            --wait-result 2>&1) || true
          echo "$LOG" | sed 's/PRIVATE KEY.*//' | sed 's/pem.*//'
          HASH=$(echo "$LOG" | grep -oE '[a-f0-9]{64}' | head -1 || true)
          echo "tx_hash=${HASH:-none}"
          if echo "$LOG" | grep -qiE 'failed|insufficient funds|not owner|only owner|unrecognized arguments|transaction failed'; then
            echo "Upgrade may have failed — inspect log above"
            exit 1
          fi
          if [ -z "$HASH" ]; then
            echo "No tx hash — treating as failure"
            exit 1
          fi
          echo "UPGRADE_TX=$HASH" >> "$GITHUB_ENV"

      - name: Deploy new SC
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          NONCE=$(curl -sS "https://api.multiversx.com/accounts/erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          LOG=$(mxpy contract deploy \
            --bytecode="${AGENTS_WASM}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --gas-limit=60000000 \
            --proxy="${PROXY}" \
            --chain="${CHAIN_ID}" \
            --nonce="$NONCE" \
            --arguments "${FEE_BPS}" \
            --send \
            --wait-result 2>&1) || true
          echo "$LOG" | sed 's/PRIVATE KEY.*//'
          ADDR=$(echo "$LOG" | grep -oE 'erd1qqqq[a-z0-9]{50,}' | head -1 || true)
          echo "agents_sc=${ADDR}"
          test -n "$ADDR"
          echo "AGENTS_SC=$ADDR" >> "$GITHUB_ENV"

      - name: Optional setPackCollection
        if: env.MODE == 'upgrade' && (env.COL_PULSE != '' || env.COL_YIELD != '' || env.COL_SENTINEL != '')
        run: |
          set -euo pipefail
          call_set() {
            local pt="$1" col="$2"
            [ -z "$col" ] && return 0
            echo "setPackCollection $pt → $col"
            mxpy contract call "${CONTRACT_ADDRESS}" \
              --function=setPackCollection \
              --arguments "0x${pt}" "str:${col}" \
              --pem="${RUNNER_TEMP}/deployer.pem" \
              --proxy="${PROXY}" --chain="${CHAIN_ID}" \
              --gas-limit=12000000 --send --wait-result || true
          }
          call_set 01 "${COL_PULSE}"
          call_set 02 "${COL_YIELD}"
          call_set 03 "${COL_SENTINEL}"

      - name: Post-check buyPack endpoint
        if: env.MODE == 'upgrade'
        run: |
          set -euo pipefail
          sleep 12
          CODE=$(curl -sS -X POST "${API}/vm-values/query" -H 'Content-Type: application/json' \
            -d "{\"scAddress\":\"${CONTRACT_ADDRESS}\",\"funcName\":\"getPackPrice\",\"args\":[\"01\"]}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); x=d.get('data',{}).get('data',{}); print(x.get('returnCode','err'), x.get('returnMessage','')[:80])")
          echo "getPackPrice query: $CODE"
          HASH=$(curl -sS "${API}/accounts/${CONTRACT_ADDRESS}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('codeHash',''))")
          echo "new_codeHash=$HASH"
          echo "explorer=https://explorer.multiversx.com/accounts/${CONTRACT_ADDRESS}"

      - name: Cleanup PEM
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
