name: Account identity and fiat subscription policy

on:
  pull_request:
    paths:
      - 'services/access-api/src/accountTypes.mjs'
      - 'services/access-api/src/accountRepository.mjs'
      - 'services/access-api/src/neonAuthIdentity.mjs'
      - 'services/access-api/src/subscriptionAccess.mjs'
      - 'services/access-api/src/walletLinkChallenge.mjs'
      - 'services/access-api/src/walletLinkFlow.mjs'
      - 'services/access-api/tests/accountTypes.test.mjs'
      - 'services/access-api/tests/accountRepository.test.mjs'
      - 'services/access-api/tests/neonAuthIdentity.test.mjs'
      - 'services/access-api/tests/subscriptionAccess.test.mjs'
      - 'services/access-api/tests/walletLinkChallenge.test.mjs'
      - 'services/access-api/tests/walletLinkFlow.test.mjs'
      - '.github/workflows/account-policy-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/access-api/src/accountTypes.mjs'
      - 'services/access-api/src/accountRepository.mjs'
      - 'services/access-api/src/neonAuthIdentity.mjs'
      - 'services/access-api/src/subscriptionAccess.mjs'
      - 'services/access-api/src/walletLinkChallenge.mjs'
      - 'services/access-api/src/walletLinkFlow.mjs'
      - 'services/access-api/tests/accountTypes.test.mjs'
      - 'services/access-api/tests/accountRepository.test.mjs'
      - 'services/access-api/tests/neonAuthIdentity.test.mjs'
      - 'services/access-api/tests/subscriptionAccess.test.mjs'
      - 'services/access-api/tests/walletLinkChallenge.test.mjs'
      - 'services/access-api/tests/walletLinkFlow.test.mjs'
      - '.github/workflows/account-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test walletless accounts, subscriptions and replay safety
        run: |
          node --test \
            services/access-api/tests/accountTypes.test.mjs \
            services/access-api/tests/accountRepository.test.mjs \
            services/access-api/tests/neonAuthIdentity.test.mjs \
            services/access-api/tests/subscriptionAccess.test.mjs \
            services/access-api/tests/walletLinkChallenge.test.mjs \
            services/access-api/tests/walletLinkFlow.test.mjs
