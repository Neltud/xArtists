name: Local memory commitments — offline verification
on:
  pull_request:
    paths:
      - 'lia/memory/anchor_proofs.py'
      - 'lia/memory/test_anchor_proofs.py'
      - '.github/workflows/onchain-memory-anchor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lia/memory/anchor_proofs.py'
      - 'lia/memory/test_anchor_proofs.py'
      - '.github/workflows/onchain-memory-anchor-ci.yml'
permissions:
  contents: read
jobs:
  commitments:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and offline integrity proof tests — no RPC, wallet or transaction
        run: |
          python -m compileall -q lia/memory/anchor_proofs.py
          python -m unittest discover -s lia/memory -p 'test_anchor_proofs.py' -v
