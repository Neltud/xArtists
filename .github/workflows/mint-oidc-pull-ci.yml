name: Mint OIDC pull CI (ephemeral PostgreSQL)

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/access-api/src/mintOidcPull.mjs'
      - 'services/access-api/src/server.mjs'
      - 'services/access-api/tests/mintOidcPull.test.mjs'
      - 'scripts/ops/mint_oidc_pull.mjs'
      - '.github/workflows/mint-oidc-pull.yml'
      - '.github/workflows/mint-oidc-pull-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/access-api/src/mintOidcPull.mjs'
      - 'services/access-api/src/server.mjs'
      - 'services/access-api/tests/mintOidcPull.test.mjs'
      - 'scripts/ops/mint_oidc_pull.mjs'
      - '.github/workflows/mint-oidc-pull.yml'
      - '.github/workflows/mint-oidc-pull-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xartists_mint_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xartists_mint_probe"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xartists_mint_probe
      ALLOW_EPHEMERAL_MINT_PG_TEST: '1'
      PGSSL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - name: Syntax validate all changed Node files
        run: |
          node --check services/access-api/src/server.mjs
          node --check services/access-api/src/mintOidcPull.mjs
          node --check scripts/ops/mint_oidc_pull.mjs
      - name: Install locked API dependencies
        working-directory: services/access-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove OIDC signature, claim scope and PostgreSQL exactly-once
        working-directory: services/access-api
        run: node --test tests/mintOidcPull.test.mjs
