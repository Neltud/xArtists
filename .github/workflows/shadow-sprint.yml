# P0 — keep Shadow Sprint KPIs alive (paper only)
name: Shadow Sprint Tick

on:
  schedule:
    # Every 2 hours UTC
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shadow sprint tick
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m lia.shadow.sprint || true
          python -m lia.vellum.publish_lia_status || true

      - name: Commit data if changed
        run: |
          git config user.name "xArtists-shadow-bot"
          git config user.email "bot@xartists.local"
          git add data/lia_paper_legs.json data/lia_shadow_export.json data/lia_shadow_sprint.json \
            apps/frontend/public/data/lia_shadow_export.json apps/frontend/public/data/lia_shadow_sprint.json \
            apps/frontend/public/data/lia_status.json data/lia_status.json \
            docs/data/lia_shadow_export.json docs/data/lia_status.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No shadow data changes"
          else
            git commit -m "data(shadow): automated sprint tick [skip ci]"
            git push
          fi
