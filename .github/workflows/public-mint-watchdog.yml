# Public GET-only readiness; a PASS means browse-only infrastructure, NOT S1/S2.
name: Public mint-store readiness watchdog (no commercial GO)

on:
  pull_request:
    paths:
      - 'scripts/ops/public_mint_watchdog.mjs'
      - 'scripts/ops/tests/public_mint_watchdog.test.mjs'
      - '.github/workflows/public-mint-watchdog.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/public_mint_watchdog.mjs'
      - 'scripts/ops/tests/public_mint_watchdog.test.mjs'
      - '.github/workflows/public-mint-watchdog.yml'
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operator script without credentials or network
        run: |
          node --check scripts/ops/public_mint_watchdog.mjs
          node --test scripts/ops/tests/public_mint_watchdog.test.mjs

  live-readonly:
    # PRs cannot claim to verify a not-yet-deployed branch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: safety-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public GET endpoints after Render cold-start retry
        run: node scripts/ops/public_mint_watchdog.mjs
      - name: Declare result scope
        if: always()
        run: |
          echo 'This watchdog only checks browse-only API/frontend and PostgreSQL readiness.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not prove any PSP settlement, mainnet mint, NFT delivery, refund or commercial GO.' >> "$GITHUB_STEP_SUMMARY"
