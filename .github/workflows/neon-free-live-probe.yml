name: Neon Free API staging — external read-only probe
on:
  pull_request:
    paths:
      - 'scripts/ops/probe-neon-free.mjs'
      - 'tests/probe-neon-free.test.mjs'
      - '.github/workflows/neon-free-live-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/probe-neon-free.mjs'
      - 'tests/probe-neon-free.test.mjs'
      - '.github/workflows/neon-free-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only HTTPS probe contract
        run: node --test tests/probe-neon-free.test.mjs
  public-http:
    if: github.event_name != 'pull_request'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Neon Function externally without POST, secrets, email or billing
        run: node scripts/ops/probe-neon-free.mjs
