name: Agent pack EGLD exact VM price gate

on:
  pull_request:
    paths:
      - 'apps/frontend/src/lib/agentPackVmQuote.mjs'
      - 'apps/frontend/src/lib/agentPackVmQuote.d.mts'
      - 'apps/frontend/src/lib/egldExactAmount.mjs'
      - 'apps/frontend/src/hooks/useAgentPackTx.ts'
      - 'apps/frontend/tests/agent-pack-fresh-vm-quote.test.mjs'
      - '.github/workflows/agent-pack-fresh-price-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/src/lib/agentPackVmQuote.mjs'
      - 'apps/frontend/src/lib/agentPackVmQuote.d.mts'
      - 'apps/frontend/src/hooks/useAgentPackTx.ts'
      - 'apps/frontend/tests/agent-pack-fresh-vm-quote.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quote-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deny stale catalogue EGLD and unsafe listing fallback
        run: node --test apps/frontend/tests/agent-pack-fresh-vm-quote.test.mjs
