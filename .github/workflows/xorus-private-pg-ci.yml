name: xOrus private entitlements — disposable PostgreSQL

on:
  pull_request:
    paths:
      - 'services/access-api/migrations/20261113_xorus_private_access.sql'
      - 'services/access-api/src/xorusPrivateStore.mjs'
      - 'services/access-api/src/xorusEntitlements.mjs'
      - 'services/access-api/tests/xorusPrivateStorePostgres.test.mjs'
      - 'services/access-api/tests/xorusEntitlements.test.mjs'
      - '.github/workflows/xorus-private-pg-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/access-api/migrations/20261113_xorus_private_access.sql'
      - 'services/access-api/src/xorusPrivateStore.mjs'
      - 'services/access-api/src/xorusEntitlements.mjs'
      - 'services/access-api/tests/xorusPrivateStorePostgres.test.mjs'
      - 'services/access-api/tests/xorusEntitlements.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xorus-private-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xartists_xorus_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xartists_xorus_probe"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_XORUS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xartists_xorus_probe
      ALLOW_EPHEMERAL_XORUS_PG_TEST: '1'
      MINT_LIVE_ENABLED: '0'
      PAYBOX_CHECKOUT_ENABLED: '0'
      STRIPE_LIVE_CHECKOUT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - name: Install API dependencies without lifecycle scripts
        working-directory: services/access-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check code and private authorization tests
        working-directory: services/access-api
        run: |
          node --check src/xorusPrivateStore.mjs
          node --test tests/xorusEntitlements.test.mjs
      - name: Verify private grants, report constraints, isolation and quota under real PG concurrency
        working-directory: services/access-api
        run: node --test tests/xorusPrivateStorePostgres.test.mjs
      - name: Report isolation
        run: echo 'Disposable localhost DB only. No Neon/Render migration, email, wallet, PSP, mint or trade.' >> "$GITHUB_STEP_SUMMARY"
