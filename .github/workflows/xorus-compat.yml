name: Xorus paper compatibility (offline, no deployment)

on:
  pull_request:
    paths:
      - 'lia/xorus/**'
      - 'lia/chorus/**'
      - 'tests/test_xorus_alias.py'
      - '.github/workflows/xorus-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xorus-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Xorus alias and Chorus paper invariants on the same SHA (offline)
        env:
          PYTHONPATH: ${{ github.workspace }}
          LIA_LIVE_TRADING: '0'
        run: |
          python3 -m unittest discover -s tests -p 'test_xorus_alias.py' -v
          python3 -m unittest discover -s tests -p 'test_chorus_paper_safety.py' -v
