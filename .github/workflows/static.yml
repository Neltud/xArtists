# Deploy Vite React dApp to GitHub Pages
name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/assets/**"
      - "docs/index.html"
      - "docs/404.html"
      - "docs/**/*.md"
      - "**.md"
      - "docs/marketing/**"
      - "docs/BUILD_ERROR.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-static"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Dashboard source (must be clean home)
        run: |
          if grep -qiE 'ops clutter|dev home|Become\\|Posts X' src/pages/Dashboard.tsx; then
            echo '::error::Dashboard.tsx still contains ops/home clutter'
            exit 1
          fi
          echo 'Dashboard source OK'

      - name: Verify Agents = 3 packs only
        run: |
          if ! grep -q 'Pulse · Yield · Sentinel' src/pages/Agents.tsx; then
            echo '::error::Agents.tsx must advertise exactly 3 packs'
            exit 1
          fi
          if grep -qiE 'voyage|travel agent|agent art|NftPacksGallery' src/pages/Agents.tsx; then
            echo '::error::Agents.tsx must not list travel/art agents'
            exit 1
          fi
          echo 'Agents OK'

      - name: Build
        id: vite_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-out.txt
          echo "EXIT:${PIPESTATUS[0]}" | tee -a build-out.txt
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_CATALOG_API: http://kc7hfr7tb9aqreaqtst0834c2c.ingress.hurricane.akash.pub
          VITE_APP_BUILD: "3.10.0"
          VITE_VELLUM_8008_WEBHOOK: ${{ secrets.VITE_VELLUM_8008_WEBHOOK }}
          VITE_TRO_STAKING_CODEHASH_OK: ${{ secrets.VITE_TRO_STAKING_CODEHASH_OK }}
          VITE_MARKETPLACE_CODEHASH_OK: ${{ secrets.VITE_MARKETPLACE_CODEHASH_OK }}
          VITE_VENUE_CODEHASH_OK: ${{ secrets.VITE_VENUE_CODEHASH_OK }}
          VITE_AGENTS_CODEHASH_OK: ${{ secrets.VITE_AGENTS_CODEHASH_OK }}
          VITE_NFT_STAKING_CODEHASH_OK: ${{ secrets.VITE_NFT_STAKING_CODEHASH_OK }}
          VITE_TRO_GOVERNANCE_CODEHASH_OK: ${{ secrets.VITE_TRO_GOVERNANCE_CODEHASH_OK }}
          VITE_AGENT_ESCROW_CODEHASH_OK: ${{ secrets.VITE_AGENT_ESCROW_CODEHASH_OK }}
          VITE_TREASURY_CODEHASH_OK: ${{ secrets.VITE_TREASURY_CODEHASH_OK }}
          VITE_SLOT_CASINO_CODEHASH_OK: ${{ secrets.VITE_SLOT_CASINO_CODEHASH_OK }}
          VITE_TRO_STAKING_ADDRESS: ${{ secrets.VITE_TRO_STAKING_ADDRESS }}
          VITE_MARKETPLACE_ADDRESS: ${{ secrets.VITE_MARKETPLACE_ADDRESS }}
          VITE_VENUE_SC_ADDRESS: ${{ secrets.VITE_VENUE_SC_ADDRESS }}

      - name: Capture build error log
        if: steps.vite_build.outcome == 'failure'
        working-directory: .
        run: |
          mkdir -p docs
          {
            echo "# Vite build failed @ ${{ github.sha }}"
            echo "time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 120 apps/frontend/build-out.txt || echo '(no build-out.txt)'
          } > docs/BUILD_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BUILD_ERROR.txt
          git commit -m "chore: capture vite BUILD_ERROR [skip ci]" || true
          git push || true

      - name: Fail if build failed
        if: steps.vite_build.outcome == 'failure'
        run: |
          echo '::error::Vite build failed — see docs/BUILD_ERROR.txt'
          tail -n 40 build-out.txt || true
          exit 1

      - name: Stamp build id
        run: |
          echo "${{ github.sha }}" > dist/BUILD_SHA.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > dist/BUILD_TIME.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

      - name: Sync dist → docs/ (GitHub Pages source = branch main /docs)
        working-directory: .
        run: |
          set -e
          rm -rf docs/assets
          mkdir -p docs/assets
          cp -R apps/frontend/dist/assets/. docs/assets/
          cp apps/frontend/dist/index.html docs/index.html
          if [ -f apps/frontend/dist/404.html ]; then
            cp apps/frontend/dist/404.html docs/404.html
          else
            cp apps/frontend/dist/index.html docs/404.html
          fi
          for f in manifest.webmanifest service-worker.js favicon.svg robots.txt sitemap.xml; do
            if [ -f "apps/frontend/dist/$f" ]; then cp "apps/frontend/dist/$f" "docs/$f"; fi
          done
          if [ -d apps/frontend/dist/museum ]; then
            rm -rf docs/museum
            cp -R apps/frontend/dist/museum docs/museum
          fi
          if [ -d apps/frontend/dist/data ]; then
            rm -rf docs/data
            cp -R apps/frontend/dist/data docs/data
          fi
          cp apps/frontend/dist/BUILD_SHA.txt docs/BUILD_SHA.txt 2>/dev/null || true
          cp apps/frontend/dist/BUILD_TIME.txt docs/BUILD_TIME.txt 2>/dev/null || true
          rm -f docs/BUILD_ERROR.txt

      - name: Commit docs SPA sync
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes"
          else
            git commit -m "chore(pages): sync docs SPA [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
