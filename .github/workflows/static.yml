# Deploy Vite React dApp to GitHub Pages — sole producer of public frontend
name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/assets/**"
      - "docs/index.html"
      - "docs/404.html"
      - "docs/**/*.md"
      - "**.md"
      - "docs/marketing/**"
      - "docs/BUILD_ERROR.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-static"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: check:routes (pre-build)
        run: npm run check:routes

      - name: render:check (pre-build)
        run: npm run render:check

      - name: Verify Dashboard source (must be clean home)
        run: |
          if grep -qiE 'ops clutter|dev home|Become\\|Posts X' src/pages/Dashboard.tsx; then
            echo '::error::Dashboard.tsx still contains ops/home clutter'
            exit 1
          fi
          echo 'Dashboard source OK'

      - name: Verify Agents = 3 packs only
        run: |
          AGENTS_FILE=src/pages/Agents.tsx
          if [ ! -f "$AGENTS_FILE" ]; then AGENTS_FILE=src/pages/AgentsPage.tsx; fi
          if ! grep -q 'Pulse · Yield · Sentinel' "$AGENTS_FILE" 2>/dev/null; then
            echo '::warning::Agents pack label not found (non-blocking)'
          fi

      - name: Build
        id: vite_build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-out.txt
          echo "EXIT:${PIPESTATUS[0]}" | tee -a build-out.txt
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_CATALOG_API: http://kc7hfr7tb9aqreaqtst0834c2c.ingress.hurricane.akash.pub
          VITE_APP_BUILD: "0.117.0"
          VITE_LIA_LIVE_TRADING: "0"
          VITE_VELLUM_8008_WEBHOOK: ${{ secrets.VITE_VELLUM_8008_WEBHOOK }}
          VITE_TRO_STAKING_CODEHASH_OK: ${{ secrets.VITE_TRO_STAKING_CODEHASH_OK }}
          VITE_MARKETPLACE_CODEHASH_OK: ${{ secrets.VITE_MARKETPLACE_CODEHASH_OK }}
          VITE_VENUE_CODEHASH_OK: ${{ secrets.VITE_VENUE_CODEHASH_OK }}
          VITE_AGENTS_CODEHASH_OK: ${{ secrets.VITE_AGENTS_CODEHASH_OK }}
          VITE_NFT_STAKING_CODEHASH_OK: ${{ secrets.VITE_NFT_STAKING_CODEHASH_OK }}
          VITE_TRO_GOVERNANCE_CODEHASH_OK: ${{ secrets.VITE_TRO_GOVERNANCE_CODEHASH_OK }}
          VITE_AGENT_ESCROW_CODEHASH_OK: ${{ secrets.VITE_AGENT_ESCROW_CODEHASH_OK }}
          VITE_TREASURY_CODEHASH_OK: ${{ secrets.VITE_TREASURY_CODEHASH_OK }}
          VITE_SLOT_CASINO_CODEHASH_OK: ${{ secrets.VITE_SLOT_CASINO_CODEHASH_OK }}
          VITE_TRO_STAKING_ADDRESS: ${{ secrets.VITE_TRO_STAKING_ADDRESS }}
          VITE_MARKETPLACE_ADDRESS: ${{ secrets.VITE_MARKETPLACE_ADDRESS }}
          VITE_VENUE_SC_ADDRESS: ${{ secrets.VITE_VENUE_SC_ADDRESS }}
          VITE_TRO_TOKEN_ID: TRO-94c925
          VITE_XARTISTS_NFT_COLLECTIONS: XAR-cee2e0,AGR-9bd53e,ALISTOR-a646bc,ASFT-a6273a,BGG-2b627c,HP47X2-b71543,MAS-5189b6,NFTUDURI-2990b6,XTR-e5072b,XAUS-d9cf1f,TRO-652d6d

      - name: Capture build error log
        if: failure()
        working-directory: .
        run: |
          mkdir -p docs
          cp apps/frontend/build-out.txt docs/BUILD_ERROR.txt || true
          echo 'Build failed — see docs/BUILD_ERROR.txt'

      - name: Fail if build failed
        if: failure()
        run: exit 1

      - name: verify:site (post-build)
        run: npm run verify:site

      - name: Write build-info.json (public, no secrets)
        working-directory: .
        run: |
          mkdir -p apps/frontend/dist
          cat > apps/frontend/dist/build-info.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "app_build": "0.117.0",
            "workflow": "static.yml",
            "ref": "${{ github.ref }}"
          }
          EOF
          # Stamp index.html meta if present
          if [ -f apps/frontend/dist/index.html ]; then
            sed -i 's/content="4.0.3-csp"/content="0.117.0"/g' apps/frontend/dist/index.html || true
          fi

      - name: Prepare Pages artifact
        working-directory: .
        run: |
          mkdir -p _site
          cp -r apps/frontend/dist/* _site/
          # SPA fallback
          cp _site/index.html _site/404.html
          test -f _site/build-info.json && echo "build-info present" || echo "::warning::build-info missing"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
