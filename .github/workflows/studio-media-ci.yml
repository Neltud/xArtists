name: Studio Media IPFS — backend tests and frontend build

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/access-api/**'
      - 'apps/frontend/src/components/CreatorMediaUpload.tsx'
      - 'apps/frontend/src/pages/StudioPage.tsx'
      - 'apps/frontend/src/styles/creator-studio-light.css'
      - 'apps/frontend/tests/studio-light-first.test.mjs'
      - 'apps/frontend/src/pages/MarketplacePage.tsx'
      - 'apps/frontend/src/components/market/RwaPhysicalPanel.tsx'
      - '.github/workflows/studio-media-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-media-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - name: Locked API dependencies (strict, PR #274)
        working-directory: services/access-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run deterministic IPFS, MIME, JWT and physical custody tests
        working-directory: services/access-api
        run: npm test
  studio-media-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Strict global TypeScript (issue 271 resolved)
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Studio light-first and no-wallet copy regression
        working-directory: apps/frontend
        run: node --test tests/studio-light-first.test.mjs
      - name: Production build
        working-directory: apps/frontend
        run: npm run build
  studio-schema-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xartists_studio_probe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d xartists_studio_probe"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_STUDIO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xartists_studio_probe
      ALLOW_EPHEMERAL_STUDIO_PG_TEST: '1'
      MINT_LIVE_ENABLED: '0'
      CREATOR_MEDIA_UPLOAD_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/access-api
      - name: Real migrations, MIME constraints, model size and SELECT-only schema probe
        run: node --test tests/studioMigrationsPostgres.test.mjs
        working-directory: services/access-api
