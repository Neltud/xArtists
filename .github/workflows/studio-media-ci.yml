name: Studio Media IPFS — backend tests and frontend build

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/access-api/**'
      - 'apps/frontend/src/components/CreatorMediaUpload.tsx'
      - 'apps/frontend/src/pages/StudioPage.tsx'
      - 'apps/frontend/src/pages/MarketplacePage.tsx'
      - 'apps/frontend/src/components/market/RwaPhysicalPanel.tsx'
      - '.github/workflows/studio-media-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-media-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - name: Locked API dependencies (strict, PR #274)
        working-directory: services/access-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run deterministic IPFS, MIME, JWT and physical custody tests
        working-directory: services/access-api
        run: npm test
  studio-media-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Check touched files against preexisting TypeScript baseline
        working-directory: apps/frontend
        run: |
          set +e
          npm run typecheck > /tmp/studio-typecheck.log 2>&1
          status=$?
          set -e
          if grep -E '^src/(components/CreatorMediaUpload|pages/StudioPage|pages/MarketplacePage|components/market/RwaPhysicalPanel)\.tsx.*error TS[0-9]+' /tmp/studio-typecheck.log; then
            echo "::error title=Creator Studio regression::TS errors in changed Studio/Marketplace files"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            count=$(grep -c 'error TS[0-9]' /tmp/studio-typecheck.log || true)
            echo "::warning title=TypeScript baseline issue #271::Global check still reports $count errors outside this PR's changed files"
          fi
      - name: Production build
        working-directory: apps/frontend
        run: npm run build
