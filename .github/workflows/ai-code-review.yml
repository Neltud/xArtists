name: AI Code Review & Security Audit

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          git diff "origin/${{ github.base_ref }}...HEAD" > pr_diff.txt || git diff HEAD~1 > pr_diff.txt || echo "(empty diff)" > pr_diff.txt
          wc -c pr_diff.txt

      - name: Run architecture review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COMMENTS_URL: ${{ github.event.pull_request.comments_url }}
        run: python3 scripts/ci_ai_pr_review.py
