name: Neon authenticated account pilot — external safety probe
on:
  pull_request:
    paths:
      - 'scripts/ops/probe-neon-auth-pilot.mjs'
      - 'tests/probe-neon-auth-pilot.test.mjs'
      - '.github/workflows/neon-auth-pilot-live.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/probe-neon-auth-pilot.mjs'
      - 'tests/probe-neon-auth-pilot.test.mjs'
      - '.github/workflows/neon-auth-pilot-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/probe-neon-auth-pilot.test.mjs
  live:
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert HTTP 401 for anonymous login and OFF for all money/Studio routes
        run: node scripts/ops/probe-neon-auth-pilot.mjs
