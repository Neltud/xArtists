name: xOrus unified platform hub — isolated read-only service

on:
  pull_request:
    paths:
      - 'deploy/neon/xorus-hub/**'
      - 'scripts/ops/package-xorus-hub.py'
      - '.github/workflows/xorus-platform-hub-ci.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/neon/xorus-hub/**'
      - 'scripts/ops/package-xorus-hub.py'
      - '.github/workflows/xorus-platform-hub-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deploy/neon/xorus-hub/package-lock.json
      - name: Install runtime dependencies without lifecycle scripts
        working-directory: deploy/neon/xorus-hub
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify routes, provenance, isolation, stale data and refusal of execution
        working-directory: deploy/neon/xorus-hub
        run: npm test
      - name: Validate deployment archive
        run: python3 scripts/ops/package-xorus-hub.py

      - name: Smoke the actual packaged runtime with no database or secrets
        run: |
          mkdir -p "$RUNNER_TEMP/xorus-hub-smoke"
          python3 -m zipfile -e dist/xorus-hub.zip "$RUNNER_TEMP/xorus-hub-smoke"
          cd "$RUNNER_TEMP/xorus-hub-smoke"
          env -i PATH="$PATH" HOME="$HOME" node --input-type=module -e '
            import assert from "node:assert/strict";
            const {default: hub}=await import("./index.mjs");
            const get=path=>hub.fetch(new Request("https://hub.invalid"+path));
            const health=await get("/health");
            assert.equal(health.status,200);
            const body=await health.json();
            assert.equal(body.execution_authorized,false);
            assert.equal(body.trading_enabled,false);
            assert.equal((await get("/v1/xorus/reference-quotes")).status,200);
            assert.equal((await get("/v1/xorus/network-status")).status,503);
            assert.equal((await get("/v1/xorus/agents/reports")).status,401);
            assert.equal((await get("/v1/xorus/orders")).status,503);
          '
      - name: Retain verified deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: xorus-hub-runtime
          path: dist/xorus-hub.zip
          retention-days: 7
          if-no-files-found: error
