name: vellum-command

on:
  push:
    paths:
      - "packages/vellum-command/**"
      - "apps/frontend/public/vellum/**"
      - ".github/workflows/vellum-command-ci.yml"
  pull_request:
    paths:
      - "packages/vellum-command/**"
      - "apps/frontend/public/vellum/**"
      - ".github/workflows/vellum-command-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Paper intent engine
        run: node --test packages/vellum-command/engine.test.mjs
      - name: Public engine matches the package
        run: cmp packages/vellum-command/engine.mjs apps/frontend/public/vellum/engine.mjs
