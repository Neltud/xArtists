name: vellum-command

on:
  push:
    paths:
      - "packages/vellum-command/**"
      - "apps/frontend/public/vellum/**"
      - ".github/workflows/vellum-command-ci.yml"
  pull_request:
    paths:
      - "packages/vellum-command/**"
      - "apps/frontend/public/vellum/**"
      - ".github/workflows/vellum-command-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Paper intent engine
        run: node --test packages/vellum-command/engine.test.mjs
      - name: Public retirement gate
        run: |
          test ! -e apps/frontend/public/vellum/engine.mjs
          grep -F 'Console Vellum retirée' apps/frontend/public/vellum/index.html
          if grep -Ei '<(script|form|input|button|iframe)([[:space:]>])|planIntent|localStorage|engine\.mjs|[[:space:]]on[a-z]+[[:space:]]*=' apps/frontend/public/vellum/index.html; then
            echo 'Unexpected interactive public console'; exit 1
          fi
