name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: contracts/nft-staking,contracts/tro-staking

    - name: Check for Rust project
      run: |
        if [ ! -f Cargo.toml ]; then
          echo "No Cargo.toml — skip"
          exit 0
        fi

    - name: Format Check
      run: cargo fmt --all -- --check
      continue-on-error: true

    - name: Clippy Lint
      run: cargo clippy --all-targets -- -D warnings
      continue-on-error: true

    # MultiversX SC crates: host check is enough for CI green;
    # full wasm via sc-meta is in deploy-venue-split / deploy-scs workflows.
    - name: Build
      run: cargo check --workspace --release

    - name: Run tests
      run: cargo test --workspace --release
      continue-on-error: true
