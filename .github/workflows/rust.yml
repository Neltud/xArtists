name: Rust

# Host cargo cannot fully compile MultiversX SC (no_std + contract macros).
# Full wasm builds: deploy-venue-split.yml / deploy-scs.yml (sc-meta).
# This job only validates workspace resolution + fmt (non-blocking).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: contracts/nft-staking,contracts/tro-staking

    - name: Check for Rust project
      id: has_cargo
      run: |
        if [ -f Cargo.toml ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "No Cargo.toml — skip"
        fi

    - name: Workspace resolves
      if: steps.has_cargo.outputs.ok == 'true'
      run: |
        set -euo pipefail
        cargo metadata --format-version 1 --no-deps > /tmp/meta.json
        echo "✅ cargo metadata OK"
        python3 -c "import json; m=json.load(open('/tmp/meta.json')); print('packages:', [p['name'] for p in m['packages'] if p['source'] is None])"

    - name: Format Check
      if: steps.has_cargo.outputs.ok == 'true'
      run: cargo fmt --all -- --check
      continue-on-error: true

    - name: Clippy (non-blocking)
      if: steps.has_cargo.outputs.ok == 'true'
      run: cargo clippy --workspace -- -D warnings
      continue-on-error: true

    - name: SC compile note
      run: |
        echo "MultiversX SC host cargo check is not a gate."
        echo "Use Actions → Deploy venue-split (sc-meta) for wasm."
