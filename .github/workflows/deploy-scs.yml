name: Deploy Smart Contracts

# Deploy via mxpy + lia/vellum/deploy_scs_node.py
# Secret (pick ONE — no LIA key required):
#   SC_DEPLOYER_PEM  preferred (ephemeral deployer)
#   LIA_WALLET_PEM   legacy name, same role
# Mainnet (chain=1) blocked unless confirm_mainnet = DEPLOY_MAINNET

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain — D=devnet (default), T=testnet, 1=mainnet (gate)"
        required: true
        default: "D"
        type: choice
        options:
          - "D"
          - "T"
          - "1"
      confirm_mainnet:
        description: "Mainnet only — type exactly DEPLOY_MAINNET"
        required: false
        default: ""
        type: string
      contract:
        description: "Which contract(s) to deploy"
        required: true
        default: "nft-staking"
        type: choice
        options:
          - all
          - nft-marketplace
          - agents-marketplace
          - nft-staking
          - tro-staking
          - slot-casino
          - agent-stake-escrow
      fee_bps:
        description: "Marketplace fee BPS (ignored for staking)"
        required: true
        default: "300"
        type: string
      commit_addresses:
        description: "Commit updated data/contracts.json back to main"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: deploy-scs-${{ github.event.inputs.chain }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIA_CHAIN_ID: ${{ github.event.inputs.chain }}
      FEE_BPS: ${{ github.event.inputs.fee_bps }}
      DEPLOY_CONTRACT: ${{ github.event.inputs.contract }}
      # Prefer SC_DEPLOYER_PEM — LIA key NOT required
      LIA_WALLET_PEM: ${{ secrets.SC_DEPLOYER_PEM || secrets.LIA_WALLET_PEM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mainnet hard gate
        run: |
          set -euo pipefail
          if [ "${LIA_CHAIN_ID}" = "1" ]; then
            if [ "${{ github.event.inputs.confirm_mainnet }}" != "DEPLOY_MAINNET" ]; then
              echo "❌ MAINNET BLOQUÉ — confirm_mainnet=DEPLOY_MAINNET requis"
              exit 1
            fi
            echo "⚠️ MAINNET confirmé — double-check code + fee_bps"
          fi

      - name: Resolve proxy
        run: |
          set -euo pipefail
          case "${LIA_CHAIN_ID}" in
            1) echo "LIA_MVX_PROXY=https://gateway.multiversx.com" >> "$GITHUB_ENV" ;;
            D) echo "LIA_MVX_PROXY=https://devnet-gateway.multiversx.com" >> "$GITHUB_ENV" ;;
            T) echo "LIA_MVX_PROXY=https://testnet-gateway.multiversx.com" >> "$GITHUB_ENV" ;;
            *) echo "Unknown chain"; exit 1 ;;
          esac
          echo "Chain=${LIA_CHAIN_ID} Contract=${DEPLOY_CONTRACT} FeeBps=${FEE_BPS}"

      - name: Check deploy PEM present
        run: |
          set -euo pipefail
          if [ -z "${LIA_WALLET_PEM:-}" ]; then
            echo "❌ Aucun secret deploy trouvé."
            echo "Crée un Repository secret nommé exactement:"
            echo "  SC_DEPLOYER_PEM"
            echo "(ou LIA_WALLET_PEM en secours — ce n'est PAS le wallet LIA ops,"
            echo " c'est juste le nom de variable du workflow.)"
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi
          # length only — never print PEM
          echo "✅ Deploy PEM secret present (chars=${#LIA_WALLET_PEM})"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mxpy
        run: |
          pip install --upgrade pip
          pip install multiversx-sdk-cli
          mxpy --version || true

      - name: Setup Rust (wasm build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/**/target/
          key: sc-cargo-${{ runner.os }}-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Deploy via Python node
        id: deploy
        run: |
          set -euo pipefail
          python lia/vellum/deploy_scs_node.py | tee /tmp/deploy_out.json
          python - <<'PY'
          import json, sys
          raw = open("/tmp/deploy_out.json").read()
          start = raw.rfind("{")
          if start < 0:
              print("No JSON output"); sys.exit(1)
          data = json.loads(raw[start:])
          print("Summary:", json.dumps({k: data.get(k) for k in ("ok", "results")}, indent=2)[:2000])
          if not data.get("ok"):
              sys.exit(1)
          PY

      - name: Show addresses (no secrets)
        if: always()
        run: |
          if [ -f data/contracts.json ]; then
            echo "=== data/contracts.json ==="
            cat data/contracts.json
          fi

      - name: Commit contracts.json
        if: ${{ github.event.inputs.commit_addresses == 'true' }}
        run: |
          git config user.name "xArtists Deploy Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contracts.json data/vellum_deploy_scs.json || true
          if git diff --staged --quiet; then
            echo "No address changes to commit"
          else
            git commit -m "chore: update SC addresses after deploy (${{ github.event.inputs.chain }})"
            git push origin HEAD:main
          fi
