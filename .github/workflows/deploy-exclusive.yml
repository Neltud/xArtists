name: Deploy xArtists Exclusive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & build frontend
        working-directory: apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          mkdir -p public/data
          cp -f ../../data/*.json public/data/
          npm run build

      - name: Publish dist → docs
        run: |
          mkdir -p docs
          mkdir -p docs/data
          # Keep legal/docs markdown; replace web assets with React build
          rm -f docs/index.html
          rm -rf docs/assets docs/icons 2>/dev/null || true
          if [ -d apps/frontend/dist ]; then
            cp -r apps/frontend/dist/* docs/
            cp -f data/*.json docs/data/
            echo "Deployed React dist to docs/"
          else
            echo "ERROR: apps/frontend/dist missing"
            exit 1
          fi
          touch docs/.nojekyll
          echo "force-$(date -u +%Y%m%d%H%M%S)" > docs/DEPLOY_STAMP.txt
          ls -la docs/ | head -30

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
