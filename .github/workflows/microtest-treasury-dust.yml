name: Microtest treasury receiveAndSplit dust

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_DUST"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}
      DEPLOYER: erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g
      TREASURY: erd1qqqqqqqqqqqqqpgq245sma97w0j9ga9jdgxu36zs0v8g0y6evhxq2nkezv
      PROXY: https://gateway.multiversx.com
      CHAIN_ID: "1"

    steps:
      - name: Gate
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RUN_DUST" ]; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install multiversx-sdk-cli
      - name: PEM
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d '\n' < "${RUNNER_TEMP}/deployer.pem")
            { echo "-----BEGIN PRIVATE KEY for deployer-----"; echo "$HEX" | fold -w 64; echo "-----END PRIVATE KEY for deployer-----"; } > "${RUNNER_TEMP}/deployer.pem"
          fi
      - name: receiveAndSplit 0.001 EGLD
        run: |
          set -euo pipefail
          NONCE=$(curl -s "https://api.multiversx.com/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          mxpy contract call "$TREASURY" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --function receiveAndSplit \
            --value 0.001 \
            --gas-limit 15000000 \
            --proxy "$PROXY" --chain "$CHAIN_ID" \
            --nonce "$NONCE" \
            --send --wait-result
      - name: Verify getTotalSplit
        run: |
          python3 <<'PY'
          import urllib.request, json, base64
          ADDR="erd1qqqqqqqqqqqqqpgq245sma97w0j9ga9jdgxu36zs0v8g0y6evhxq2nkezv"
          body=json.dumps({"scAddress":ADDR,"funcName":"getTotalSplit","args":[]}).encode()
          req=urllib.request.Request("https://api.multiversx.com/vm-values/query", data=body, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req) as r:
            d=json.load(r)
          rd=(d.get("data") or {}).get("data") or {}
          raw=base64.b64decode((rd.get("returnData") or [""])[0] or "")
          print("totalSplit_atomic", int.from_bytes(raw,"big") if raw else 0)
          print("totalSplit_EGLD", (int.from_bytes(raw,"big") if raw else 0)/1e18)
          PY
      - if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
