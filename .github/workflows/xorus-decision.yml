name: xOrus Decision Agent (paper, offline, no deploy)

on:
  pull_request:
    paths:
      - 'lia/xorus/decision_agent.py'
      - 'lia/xorus/analysis_report.py'
      - 'lia/xorus/analysis_cycle.py'
      - 'tests/test_xorus_analysis_cycle.py'
      - 'tests/fixtures/xorus_analysis_collected.json'
      - 'packages/core/src/xorusAnalysisContract.mjs'
      - 'lia/xorus/swarm.py'
      - 'lia/chorus/swarm.py'
      - 'lia/chorus/catalog.py'
      - 'tests/test_xorus_decision_agent.py'
      - 'tests/test_xorus_analysis_report.py'
      - 'tests/test_xorus_public_catalog_sync.py'
      - 'apps/frontend/public/data/xorus_signal_catalog.json'
      - 'apps/frontend/public/data/xorus_analysis_preview.json'
      - 'apps/frontend/src/lib/xorusAnalysisReadout*'
      - 'apps/frontend/src/lib/xorusDecisionReadout.mjs'
      - 'apps/frontend/src/components/intelligence/**'
      - '.github/workflows/xorus-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xorus-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper board, Chair cap and Sentinel veto
        env:
          PYTHONPATH: ${{ github.workspace }}
          LIA_LIVE_TRADING: '0'
        run: |
          python -m unittest discover -s tests -p 'test_xorus_decision_agent.py' -v
          python -m unittest discover -s tests -p 'test_xorus_analysis_report.py' -v
          python -m unittest discover -s tests -p 'test_xorus_analysis_cycle.py' -v
          python -m unittest discover -s tests -p 'test_chorus_paper_safety.py' -v
          python -m unittest discover -s tests -p 'test_xorus_alias.py' -v
          python -m unittest discover -s tests -p 'test_xorus_public_catalog_sync.py' -v
