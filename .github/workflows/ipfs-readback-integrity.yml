name: IPFS media readback integrity

on:
  pull_request:
    paths:
      - 'services/access-api/src/ipfsReadback.mjs'
      - 'services/access-api/tests/ipfs-readback.test.mjs'
      - 'services/access-api/src/ipfsRestoreIntegrity.mjs'
      - 'services/access-api/tests/ipfs-restore-integrity.test.mjs'
      - 'services/access-api/scripts/verify-studio-ipfs-restore.mjs'
      - '.github/workflows/ipfs-readback-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-ipfs-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test services/access-api/tests/ipfs-readback.test.mjs services/access-api/tests/ipfs-restore-integrity.test.mjs
