name: Daily signals

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily_signal.json
        run: python3 services/signals-worker/generate_daily_signal.py
      - name: Commit if changed
        run: |
          git config user.name "xArtists-signals"
          git config user.email "signals@users.noreply.github.com"
          git add data/signals/daily_signal.json apps/frontend/public/data/signals/daily_signal.json || true
          git diff --staged --quiet || git commit -m "chore(signals): daily signal $(date -u +%Y-%m-%d)"
          git push || true
