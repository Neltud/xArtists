name: Daily signals

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate daily signal + dual xOrus reports (paper)
        env:
          # Optional: set repo secrets and XORUS_LLM_BRIEFS=1 to polish narratives.
          # Without secrets the worker stays deterministic paper synthesis.
          XORUS_LLM_BRIEFS: ${{ vars.XORUS_LLM_BRIEFS || '0' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 services/signals-worker/generate_daily_signal.py
      - name: Commit if changed
        run: |
          git config user.name "xArtists-signals"
          git config user.email "signals@users.noreply.github.com"
          git add \
            data/signals/daily_signal.json \
            data/signals/daily_dual_reports.json \
            apps/frontend/public/data/signals/daily_signal.json \
            apps/frontend/public/data/signals/daily_dual_reports.json \
            || true
          git diff --staged --quiet || git commit -m "chore(signals): daily xOrus dual reports $(date -u +%Y-%m-%d)"
          git push || true
