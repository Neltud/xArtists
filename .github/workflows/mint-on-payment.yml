name: Mint on payment (hardened Sprint 2)

run-name: "Mint ${{ inputs.live_mint == 'true' && 'LIVE' || 'DRY_RUN' }} / ${{ inputs.order_id }}"

# live_mint defaults false. Non-atomic micro-pricing is prohibited by the live gate.
# The full live-mint flow still needs a separate signed mainnet operational GO.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pulse | yield | sentinel"
        required: true
        type: choice
        options: [pulse, yield, sentinel]
      edition:
        description: "Edition label"
        required: true
        default: "1"
      buyer:
        description: "Buyer erd1"
        required: true
        default: ""
      order_id:
        description: "order_id correlation"
        required: false
        default: ""
      live_mint:
        description: "true only with human GO"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      confirm:
        description: "LIVE_MINT_MAINNET if live"
        required: false
        default: ""
      micro_price:
        description: "Legacy micro-price flag — live mint rejects true (non-atomic)"
        required: true
        type: choice
        options: ["true", "false"]
        default: "false"

permissions:
  contents: read

concurrency:
  group: mint-pack-${{ github.event.inputs.pack }}
  cancel-in-progress: false

env:
  PACK: ${{ github.event.inputs.pack }}
  EDITION: ${{ github.event.inputs.edition }}
  BUYER: ${{ github.event.inputs.buyer }}
  ORDER_ID: ${{ github.event.inputs.order_id }}
  LIVE: ${{ github.event.inputs.live_mint }}
  CONFIRM: ${{ github.event.inputs.confirm }}
  MICRO: ${{ github.event.inputs.micro_price }}
  PROXY: https://gateway.multiversx.com
  API: https://api.multiversx.com
  CHAIN: "1"
  EXPECTED_DEPLOYER: erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g
  SC: erd1qqqqqqqqqqqqqpgqgawa0p5y09f0e68pwaa50zm47jl9jxcwvhxqgdqwsg

jobs:
  dry_run:
    # No production environment or deployer key is available to a dry-run.
    if: ${{ github.event.inputs.live_mint != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate simulation inputs (no on-chain side effects)
        env:
          PACK: ${{ inputs.pack }}
          EDITION: ${{ inputs.edition }}
          BUYER: ${{ inputs.buyer }}
          ORDER_ID: ${{ inputs.order_id }}
          LIVE: ${{ inputs.live_mint }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE" = "false"
          [[ "$PACK" =~ ^(pulse|yield|sentinel)$ ]]
          [[ "$EDITION" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$BUYER" =~ ^erd1[a-z0-9]{58}$ ]]
          [[ "$ORDER_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
          test "$CONFIRM" != "LIVE_MINT_MAINNET"
          echo "status=dry_run_ok" >> "$GITHUB_STEP_SUMMARY"
          echo "order_id=$ORDER_ID; pack=$PACK" >> "$GITHUB_STEP_SUMMARY"
          echo "No production environment, no PEM, no signing, no mint, no transfers." >> "$GITHUB_STEP_SUMMARY"

  mint:
    # Live execution must retain explicit production environment approval.
    if: ${{ github.event.inputs.live_mint == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve collection
        id: col
        run: |
          set -euo pipefail
          case "$PACK" in
            pulse) echo "ticker=XAIPLS-2cf72b" >> "$GITHUB_OUTPUT"; echo "max=333" >> "$GITHUB_OUTPUT"; echo "pt=01" >> "$GITHUB_OUTPUT" ;;
            yield) echo "ticker=XAIYLD-987e24" >> "$GITHUB_OUTPUT"; echo "max=500" >> "$GITHUB_OUTPUT"; echo "pt=02" >> "$GITHUB_OUTPUT" ;;
            sentinel) echo "ticker=XAISNT-3d8a6b" >> "$GITHUB_OUTPUT"; echo "max=777" >> "$GITHUB_OUTPUT"; echo "pt=03" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Validate buyer
        run: echo "$BUYER" | grep -qE '^erd1[a-z0-9]{58}$'

      - name: Metadata
        run: |
          python3 <<'PY'
          import json, os
          pack, ed = os.environ["PACK"], int(os.environ["EDITION"])
          meta = {
            "name": f"Genesis {pack.title()} #{ed:03d}",
            "collection": "${{ steps.col.outputs.ticker }}",
            "order_id": os.environ.get("ORDER_ID") or None,
            "mode": "live" if os.environ.get("LIVE") == "true" else "dry_run",
            "micro": os.environ.get("MICRO") == "true",
            "buyer": os.environ.get("BUYER"),
          }
          open(os.environ["RUNNER_TEMP"]+"/mint_meta.json","w").write(json.dumps(meta, indent=2))
          print(json.dumps(meta, indent=2))
          PY

      - name: Dry-run
        if: ${{ github.event.inputs.live_mint != 'true' }}
        run: |
          echo "status=dry_run_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Live gates
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "LIVE_MINT_MAINNET"
          test "$CHAIN" = "1"
          # Non-atomic contract-price changes can affect other buyers; fail closed.
          test "$MICRO" = "false"
          test -n "${SC_DEPLOYER_PEM:-}"

      - name: Write PEM
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d ' \n' < "${RUNNER_TEMP}/deployer.pem")
            { echo "-----BEGIN PRIVATE KEY for deployer-----"; echo "$HEX" | fold -w 64; echo "-----END PRIVATE KEY for deployer-----"; } > "${RUNNER_TEMP}/deployer.pem"
          fi

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.live_mint == 'true' }}
        with:
          python-version: "3.11"

      - name: Install mxpy
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: pip install multiversx-sdk-cli multiversx-sdk

      - name: Live buyPack + correlated transfer
        if: ${{ github.event.inputs.live_mint == 'true' }}
        env:
          PT: ${{ steps.col.outputs.pt }}
          TICKER: ${{ steps.col.outputs.ticker }}
        run: |
          set -euo pipefail
          DEPLOYER=$(python3 -c "from pathlib import Path; from multiversx_sdk import UserPEM; import os; print(UserPEM.from_file(Path(os.environ['RUNNER_TEMP'])/'deployer.pem').public_key.to_address().to_bech32())")
          test "$DEPLOYER" = "$EXPECTED_DEPLOYER"
          BAL=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('balance','0'))")
          if [ "$MICRO" = "true" ]; then
            PRICE=1000000000000000
            GAS_RESERVE=3000000000000000
          else
            case "$PACK" in
              pulse) PRICE=33000000000000000000 ;;
              yield) PRICE=22500000000000000000 ;;
              sentinel) PRICE=15000000000000000000 ;;
            esac
            GAS_RESERVE=50000000000000000
          fi
          python3 -c "b=int('$BAL'); need=int('$PRICE')+int('$GAS_RESERVE'); assert b>=need, f'need {need/1e18} have {b/1e18}'"

          # Snapshot identifiers BEFORE buy — transfer only NEW ones
          python3 <<'PY'
          import json, urllib.request, os
          API, DEP, TICKER = os.environ["API"], os.environ["DEPLOYER"] if False else None, os.environ["TICKER"]
          from pathlib import Path
          from multiversx_sdk import UserPEM
          DEP = UserPEM.from_file(Path(os.environ["RUNNER_TEMP"])/"deployer.pem").public_key.to_address().to_bech32()
          nfts = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}/nfts?size=200"))
          ids = sorted(
            n["identifier"] for n in (nfts if isinstance(nfts, list) else [])
            if (n.get("collection") or "") == TICKER and n.get("identifier")
          )
          open(os.environ["RUNNER_TEMP"]+"/pre_nfts.json","w").write(json.dumps(ids))
          print("pre_count", len(ids))
          PY

          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          mxpy contract call "$SC" --function=setPackPrice --arguments "0x$PT" "$PRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=12000000 --send --wait-result
          sleep 5

          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          set +e
          LOG=$(mxpy contract call "$SC" --function=buyPack --arguments "0x$PT" --value="$PRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=30000000 --send --wait-result 2>&1)
          BUY_RC=$?
          set -e
          echo "$LOG" | sed 's/PRIVATE KEY.*//' | tail -25
          BUY_TX=$(echo "$LOG" | grep -oE '[a-f0-9]{64}' | head -1 || true)
          echo "buy_tx=$BUY_TX" >> "$GITHUB_STEP_SUMMARY"

          case "$PACK" in
            pulse) RPRICE=33000000000000000000 ;;
            yield) RPRICE=22500000000000000000 ;;
            sentinel) RPRICE=15000000000000000000 ;;
          esac
          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          set +e
          mxpy contract call "$SC" --function=setPackPrice --arguments "0x$PT" "$RPRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=12000000 --send --wait-result
          RESTORE_RC=$?
          set -e

          if [ "$RESTORE_RC" != "0" ]; then
            echo "RESTORE_PRICE_FAILED — fail-closed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$BUY_RC" != "0" ]; then
            echo "buyPack failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Verify on-chain price restored (best effort query)
          python3 <<'PY'
          import json, urllib.request, base64, os, time
          API, SC, PT = os.environ["API"], os.environ["SC"], os.environ["PT"]
          time.sleep(3)
          body = json.dumps({"scAddress": SC, "funcName": "getPackPrice", "args": [PT]}).encode()
          req = urllib.request.Request(API + "/vm-values/query", data=body, headers={"Content-Type": "application/json"})
          d = json.load(urllib.request.urlopen(req))
          rd = ((d.get("data") or {}).get("data") or {}).get("returnData") or []
          if not rd or not rd[0]:
              raise SystemExit("getPackPrice empty after restore")
          p = int.from_bytes(base64.b64decode(rd[0]), "big")
          expected = {"01": 33*10**18, "02": int(22.5*10**18), "03": 15*10**18}[PT]
          # allow integer 22.5
          if PT == "02":
              expected = 22500000000000000000
          if p != expected:
              raise SystemExit(f"price not restored got={p} expected={expected}")
          print("price_restored_ok", p)
          PY

          sleep 6
          python3 <<'PY'
          import json, urllib.request, os, subprocess
          from pathlib import Path
          from multiversx_sdk import UserPEM, Address
          API, PROXY, CHAIN = os.environ["API"], os.environ["PROXY"], os.environ["CHAIN"]
          DEP = UserPEM.from_file(Path(os.environ["RUNNER_TEMP"])/"deployer.pem").public_key.to_address().to_bech32()
          BUYER, TICKER = os.environ["BUYER"], os.environ["TICKER"]
          PEM = os.environ["RUNNER_TEMP"]+"/deployer.pem"
          pre = set(json.load(open(os.environ["RUNNER_TEMP"]+"/pre_nfts.json")))
          nfts = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}/nfts?size=200"))
          post = [
            n for n in (nfts if isinstance(nfts, list) else [])
            if (n.get("collection") or "") == TICKER and n.get("identifier") not in pre
          ]
          if len(post) != 1:
              raise SystemExit(f"expected exactly 1 new NFT for {TICKER}, got {len(post)} ids={[x.get('identifier') for x in post]}")
          n = post[0]
          ident, nonce = n["identifier"], int(n.get("nonce") or 0)
          token_hex = TICKER.encode().hex()
          nonce_hex = format(nonce, "x") or "0"
          if len(nonce_hex) % 2:
              nonce_hex = "0" + nonce_hex
          data = f"ESDTNFTTransfer@{token_hex}@{nonce_hex}@01@{Address.new_from_bech32(BUYER).to_hex()}"
          tx_nonce = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}")).get("nonce", 0)
          print(f"Transfer NEW {ident} → {BUYER}")
          r = subprocess.run([
              "mxpy", "tx", "new", f"--receiver={DEP}", f"--pem={PEM}",
              "--gas-limit=1000000", f"--proxy={PROXY}", f"--chain={CHAIN}",
              f"--nonce={tx_nonce}", f"--data={data}", "--send", "--wait-result",
          ], capture_output=True, text=True)
          out = ((r.stdout or "") + (r.stderr or "")).splitlines()
          print("\n".join([ln for ln in out if "PRIVATE" not in ln.upper()][-20:]))
          if r.returncode != 0:
              raise SystemExit("transfer failed")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(
              f"\n- NEW `{ident}` → `{BUYER}` order=`{os.environ.get('ORDER_ID')}`\n"
          )
          PY
          echo "status=live_mint_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup PEM
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
