name: Mint on payment (LIVE mainnet armed)

# Post-IPN / manual mint for Genesis SFT packs.
# Operator GO 2026-11-02: live_mint=true + confirm=LIVE_MINT_MAINNET authorized on mainnet.
# Requires secrets.SC_DEPLOYER_PEM in environment production.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pulse | yield | sentinel"
        required: true
        type: choice
        options: [pulse, yield, sentinel]
      edition:
        description: "Edition number (1-based, metadata label)"
        required: true
        default: "1"
      buyer:
        description: "Buyer MultiversX bech32 (required if live)"
        required: true
        default: ""
      live_mint:
        description: "true = mainnet chain tx"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      confirm:
        description: "LIVE_MINT_MAINNET required when live"
        required: true
        default: "LIVE_MINT_MAINNET"

env:
  PACK: ${{ github.event.inputs.pack }}
  EDITION: ${{ github.event.inputs.edition }}
  BUYER: ${{ github.event.inputs.buyer }}
  LIVE: ${{ github.event.inputs.live_mint }}
  CONFIRM: ${{ github.event.inputs.confirm }}
  PROXY: https://gateway.multiversx.com
  API: https://api.multiversx.com
  CHAIN: "1"

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve collection
        id: col
        run: |
          set -euo pipefail
          case "$PACK" in
            pulse) echo "ticker=XAIPLS-2cf72b" >> "$GITHUB_OUTPUT"; echo "max=333" >> "$GITHUB_OUTPUT"; echo "pt=01" >> "$GITHUB_OUTPUT" ;;
            yield) echo "ticker=XAIYLD-987e24" >> "$GITHUB_OUTPUT"; echo "max=500" >> "$GITHUB_OUTPUT"; echo "pt=02" >> "$GITHUB_OUTPUT" ;;
            sentinel) echo "ticker=XAISNT-3d8a6b" >> "$GITHUB_OUTPUT"; echo "max=777" >> "$GITHUB_OUTPUT"; echo "pt=03" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown pack"; exit 1 ;;
          esac

      - name: Build mint metadata (peinture+hud)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          pack = os.environ["PACK"]
          ed = int(os.environ["EDITION"])
          max_s = int("${{ steps.col.outputs.max }}")
          ticker = "${{ steps.col.outputs.ticker }}"
          live = os.environ.get("LIVE") == "true"
          meta = {
            "name": f"Genesis {pack.title()} #{ed:03d}",
            "description": f"SFT Genesis {pack} — recto peinture · verso HUD. one_time · durable rights.",
            "collection": ticker,
            "edition": f"{ed}/{max_s}",
            "attributes": [
              {"trait_type": "Pack", "value": pack.title()},
              {"trait_type": "Face", "value": "peinture+hud"},
              {"trait_type": "Billing", "value": "one_time"},
              {"trait_type": "Rights", "value": "durable"},
              {"trait_type": "Edition", "value": f"{ed}/{max_s}"},
              {"trait_type": "Chain", "value": "MultiversX"},
            ],
            "properties": {
              "face_recto": "peinture",
              "face_verso": "hud",
              "pack": pack,
              "billing": "one_time",
              "rights": "durable",
            },
            "mode": "live" if live else "paper",
            "buyer": os.environ.get("BUYER") or None,
          }
          path = os.environ["RUNNER_TEMP"] + "/mint_meta.json"
          open(path, "w").write(json.dumps(meta, indent=2))
          print(json.dumps(meta, indent=2))
          PY
          echo "### Mint metadata" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/mint_meta.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Paper only
        if: ${{ github.event.inputs.live_mint != 'true' }}
        run: |
          echo "PAPER — no chain tx"
          echo "status=paper_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Live gates
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "LIVE_MINT_MAINNET"
          test -n "${BUYER}"
          echo "${BUYER}" | grep -qE '^erd1[a-z0-9]{58}$'
          test -n "${SC_DEPLOYER_PEM:-}"
          echo "gates_ok buyer=$BUYER pack=$PACK" >> "$GITHUB_STEP_SUMMARY"

      - name: Write PEM
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d ' \n' < "${RUNNER_TEMP}/deployer.pem")
            { echo "-----BEGIN PRIVATE KEY for deployer-----"; echo "$HEX" | fold -w 64; echo "-----END PRIVATE KEY for deployer-----"; } > "${RUNNER_TEMP}/deployer.pem"
          fi

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.live_mint == 'true' }}
        with:
          python-version: "3.11"

      - name: Install mxpy
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: pip install multiversx-sdk-cli multiversx-sdk

      - name: Live mint via SC buyPack + transfer buyer
        if: ${{ github.event.inputs.live_mint == 'true' }}
        env:
          SC: erd1qqqqqqqqqqqqqpgqgawa0p5y09f0e68pwaa50zm47jl9jxcwvhxqgdqwsg
          PT: ${{ steps.col.outputs.pt }}
          TICKER: ${{ steps.col.outputs.ticker }}
        run: |
          set -euo pipefail
          DEPLOYER=$(python3 -c "import os; from pathlib import Path; from multiversx_sdk import UserPEM; print(UserPEM.from_file(Path(os.environ['RUNNER_TEMP'])/'deployer.pem').public_key.to_address().to_bech32())")
          echo "DEPLOYER=$DEPLOYER"
          BAL=$(curl -sS "${API}/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('balance','0'))")
          echo "balance_atomic=$BAL"
          # Official Rule1 list prices (atomic 18 decimals)
          case "$PACK" in
            pulse) PRICE=33000000000000000000 ;;
            yield) PRICE=22500000000000000000 ;;
            sentinel) PRICE=15000000000000000000 ;;
          esac
          # Ensure pack price on SC matches Rule1 for this buy
          NONCE=$(curl -sS "${API}/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          mxpy contract call "${SC}" \
            --function=setPackPrice \
            --arguments "0x${PT}" "${PRICE}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --proxy="${PROXY}" --chain="${CHAIN}" \
            --nonce="${NONCE}" --gas-limit=12000000 --send --wait-result
          sleep 5
          NONCE=$(curl -sS "${API}/accounts/${DEPLOYER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          LOG=$(mxpy contract call "${SC}" \
            --function=buyPack \
            --arguments "0x${PT}" \
            --value="${PRICE}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --proxy="${PROXY}" --chain="${CHAIN}" \
            --nonce="${NONCE}" --gas-limit=30000000 --send --wait-result 2>&1) || true
          echo "$LOG" | sed 's/PRIVATE KEY.*//' | tail -20
          BUY_TX=$(echo "$LOG" | grep -oE '[a-f0-9]{64}' | head -1 || true)
          echo "buy_tx=$BUY_TX" >> "$GITHUB_STEP_SUMMARY"
          sleep 10
          # Transfer newest NFT of collection to buyer
          python3 <<'PY'
          import json, urllib.request, os, subprocess, time
          API = os.environ["API"]
          DEP = os.environ["DEPLOYER"] if "DEPLOYER" in os.environ else None
          # re-read deployer from pem
          from pathlib import Path
          from multiversx_sdk import UserPEM, Address
          DEP = UserPEM.from_file(Path(os.environ["RUNNER_TEMP"]) / "deployer.pem").public_key.to_address().to_bech32()
          BUYER = os.environ["BUYER"]
          TICKER = os.environ["TICKER"]
          PEM = os.environ["RUNNER_TEMP"] + "/deployer.pem"
          PROXY = os.environ["PROXY"]
          CHAIN = os.environ["CHAIN"]
          nfts = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}/nfts?size=100&identity={TICKER}"))
          items = [n for n in (nfts if isinstance(nfts, list) else []) if (n.get("collection") or "") == TICKER]
          items.sort(key=lambda n: int(n.get("nonce") or 0), reverse=True)
          if not items:
              # fallback without identity filter
              nfts = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}/nfts?size=100"))
              items = [n for n in (nfts if isinstance(nfts, list) else []) if (n.get("collection") or "") == TICKER]
              items.sort(key=lambda n: int(n.get("nonce") or 0), reverse=True)
          if not items:
              raise SystemExit(f"No NFT for {TICKER} on deployer after buyPack")
          n = items[0]
          ident = n["identifier"]
          nonce = int(n.get("nonce") or 0)
          token_hex = TICKER.encode().hex()
          nonce_hex = format(nonce, "x") or "0"
          if len(nonce_hex) % 2:
              nonce_hex = "0" + nonce_hex
          admin_hex = Address.new_from_bech32(BUYER).to_hex()
          data = f"ESDTNFTTransfer@{token_hex}@{nonce_hex}@01@{admin_hex}"
          acc = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}"))
          tx_nonce = acc.get("nonce", 0)
          print(f"Transfer {ident} → {BUYER} nonce={tx_nonce}")
          cmd = [
              "mxpy", "tx", "new",
              f"--receiver={DEP}",
              f"--pem={PEM}",
              "--gas-limit=1000000",
              f"--proxy={PROXY}",
              f"--chain={CHAIN}",
              f"--nonce={tx_nonce}",
              f"--data={data}",
              "--send",
              "--wait-result",
          ]
          r = subprocess.run(cmd, capture_output=True, text=True)
          out = (r.stdout or "") + (r.stderr or "")
          lines = [ln for ln in out.splitlines() if "PRIVATE" not in ln.upper()]
          print("\n".join(lines[-25:]))
          if r.returncode != 0:
              raise SystemExit(f"transfer failed {r.returncode}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"\n- transferred `{ident}` → `{BUYER}`\n")
          print("OK", ident)
          PY
          echo "status=live_mint_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup PEM
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
