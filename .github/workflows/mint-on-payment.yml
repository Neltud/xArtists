name: Mint on payment (LIVE mainnet armed)

# Operator GO: live_mint + LIVE_MINT_MAINNET.
# If deployer underfunded: set micro_price=true (0.001 EGLD) then prices restored to Rule1.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "pulse | yield | sentinel"
        required: true
        type: choice
        options: [pulse, yield, sentinel]
      edition:
        description: "Edition label (metadata)"
        required: true
        default: "1"
      buyer:
        description: "Buyer erd1 (required if live)"
        required: true
        default: ""
      live_mint:
        description: "true = mainnet chain tx"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      confirm:
        description: "LIVE_MINT_MAINNET if live"
        required: true
        default: "LIVE_MINT_MAINNET"
      micro_price:
        description: "true = buy at 0.001 EGLD then restore Rule1 (underfunded deployer)"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"

env:
  PACK: ${{ github.event.inputs.pack }}
  EDITION: ${{ github.event.inputs.edition }}
  BUYER: ${{ github.event.inputs.buyer }}
  LIVE: ${{ github.event.inputs.live_mint }}
  CONFIRM: ${{ github.event.inputs.confirm }}
  MICRO: ${{ github.event.inputs.micro_price }}
  PROXY: https://gateway.multiversx.com
  API: https://api.multiversx.com
  CHAIN: "1"

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}
      SC: erd1qqqqqqqqqqqqqpgqgawa0p5y09f0e68pwaa50zm47jl9jxcwvhxqgdqwsg
    steps:
      - uses: actions/checkout@v4

      - name: Resolve collection
        id: col
        run: |
          set -euo pipefail
          case "$PACK" in
            pulse) echo "ticker=XAIPLS-2cf72b" >> "$GITHUB_OUTPUT"; echo "max=333" >> "$GITHUB_OUTPUT"; echo "pt=01" >> "$GITHUB_OUTPUT" ;;
            yield) echo "ticker=XAIYLD-987e24" >> "$GITHUB_OUTPUT"; echo "max=500" >> "$GITHUB_OUTPUT"; echo "pt=02" >> "$GITHUB_OUTPUT" ;;
            sentinel) echo "ticker=XAISNT-3d8a6b" >> "$GITHUB_OUTPUT"; echo "max=777" >> "$GITHUB_OUTPUT"; echo "pt=03" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Build metadata
        run: |
          python3 <<'PY'
          import json, os
          pack, ed = os.environ["PACK"], int(os.environ["EDITION"])
          max_s, ticker = int("${{ steps.col.outputs.max }}"), "${{ steps.col.outputs.ticker }}"
          meta = {
            "name": f"Genesis {pack.title()} #{ed:03d}",
            "collection": ticker,
            "edition": f"{ed}/{max_s}",
            "attributes": [
              {"trait_type": "Pack", "value": pack.title()},
              {"trait_type": "Face", "value": "peinture+hud"},
              {"trait_type": "Billing", "value": "one_time"},
              {"trait_type": "Rights", "value": "durable"},
            ],
            "mode": "live" if os.environ.get("LIVE") == "true" else "paper",
            "micro_price": os.environ.get("MICRO") == "true",
            "buyer": os.environ.get("BUYER"),
          }
          open(os.environ["RUNNER_TEMP"] + "/mint_meta.json", "w").write(json.dumps(meta, indent=2))
          print(json.dumps(meta, indent=2))
          PY
          cat "${RUNNER_TEMP}/mint_meta.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Paper only
        if: ${{ github.event.inputs.live_mint != 'true' }}
        run: echo "status=paper_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Live gates
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "LIVE_MINT_MAINNET"
          echo "$BUYER" | grep -qE '^erd1[a-z0-9]{58}$'
          test -n "${SC_DEPLOYER_PEM:-}"

      - name: Write PEM
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q BEGIN "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d ' \n' < "${RUNNER_TEMP}/deployer.pem")
            { echo "-----BEGIN PRIVATE KEY for deployer-----"; echo "$HEX" | fold -w 64; echo "-----END PRIVATE KEY for deployer-----"; } > "${RUNNER_TEMP}/deployer.pem"
          fi

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.live_mint == 'true' }}
        with:
          python-version: "3.11"

      - name: Install mxpy
        if: ${{ github.event.inputs.live_mint == 'true' }}
        run: pip install multiversx-sdk-cli multiversx-sdk

      - name: Live buyPack + transfer
        if: ${{ github.event.inputs.live_mint == 'true' }}
        env:
          PT: ${{ steps.col.outputs.pt }}
          TICKER: ${{ steps.col.outputs.ticker }}
        run: |
          set -euo pipefail
          DEPLOYER=$(python3 -c "from pathlib import Path; from multiversx_sdk import UserPEM; import os; print(UserPEM.from_file(Path(os.environ['RUNNER_TEMP'])/'deployer.pem').public_key.to_address().to_bech32())")
          echo "DEPLOYER=$DEPLOYER"
          BAL=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('balance','0'))")
          echo "balance_atomic=$BAL"
          if [ "$MICRO" = "true" ]; then
            PRICE=1000000000000000
          else
            case "$PACK" in
              pulse) PRICE=33000000000000000000 ;;
              yield) PRICE=22500000000000000000 ;;
              sentinel) PRICE=15000000000000000000 ;;
            esac
          fi
          echo "buy_price_atomic=$PRICE micro=$MICRO"
          python3 -c "b=int('$BAL'); need=int('$PRICE')+50_000_000_000_000_000; assert b>=need, f'need {need/1e18:.4f} EGLD have {b/1e18:.6f} — fund deployer or micro_price=true'"
          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          mxpy contract call "$SC" --function=setPackPrice --arguments "0x$PT" "$PRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=12000000 --send --wait-result
          sleep 5
          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          LOG=$(mxpy contract call "$SC" --function=buyPack --arguments "0x$PT" --value="$PRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=30000000 --send --wait-result 2>&1) || true
          echo "$LOG" | sed 's/PRIVATE KEY.*//' | tail -20
          sleep 10
          # restore Rule1 always after micro
          case "$PACK" in
            pulse) RPRICE=33000000000000000000 ;;
            yield) RPRICE=22500000000000000000 ;;
            sentinel) RPRICE=15000000000000000000 ;;
          esac
          NONCE=$(curl -sS "$API/accounts/$DEPLOYER" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          mxpy contract call "$SC" --function=setPackPrice --arguments "0x$PT" "$RPRICE" \
            --pem="${RUNNER_TEMP}/deployer.pem" --proxy="$PROXY" --chain="$CHAIN" \
            --nonce="$NONCE" --gas-limit=12000000 --send --wait-result || true
          sleep 4
          python3 <<'PY'
          import json, urllib.request, os, subprocess
          from pathlib import Path
          from multiversx_sdk import UserPEM, Address
          API, PROXY, CHAIN = os.environ["API"], os.environ["PROXY"], os.environ["CHAIN"]
          DEP = UserPEM.from_file(Path(os.environ["RUNNER_TEMP"]) / "deployer.pem").public_key.to_address().to_bech32()
          BUYER, TICKER = os.environ["BUYER"], os.environ["TICKER"]
          PEM = os.environ["RUNNER_TEMP"] + "/deployer.pem"
          nfts = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}/nfts?size=100"))
          items = [n for n in (nfts if isinstance(nfts, list) else []) if (n.get("collection") or "") == TICKER]
          items.sort(key=lambda n: int(n.get("nonce") or 0), reverse=True)
          if not items:
              raise SystemExit(f"No NFT {TICKER} on deployer")
          n = items[0]
          ident, nonce = n["identifier"], int(n.get("nonce") or 0)
          token_hex = TICKER.encode().hex()
          nonce_hex = format(nonce, "x") or "0"
          if len(nonce_hex) % 2:
              nonce_hex = "0" + nonce_hex
          data = f"ESDTNFTTransfer@{token_hex}@{nonce_hex}@01@{Address.new_from_bech32(BUYER).to_hex()}"
          tx_nonce = json.load(urllib.request.urlopen(f"{API}/accounts/{DEP}")).get("nonce", 0)
          print(f"Transfer {ident} → {BUYER}")
          r = subprocess.run([
              "mxpy", "tx", "new", f"--receiver={DEP}", f"--pem={PEM}",
              "--gas-limit=1000000", f"--proxy={PROXY}", f"--chain={CHAIN}",
              f"--nonce={tx_nonce}", f"--data={data}", "--send", "--wait-result",
          ], capture_output=True, text=True)
          out = ((r.stdout or "") + (r.stderr or "")).splitlines()
          print("\n".join([ln for ln in out if "PRIVATE" not in ln.upper()][-20:]))
          if r.returncode != 0:
              raise SystemExit("transfer failed")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(f"\n- OK `{ident}` → `{BUYER}`\n")
          PY
          echo "status=live_mint_ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup PEM
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
