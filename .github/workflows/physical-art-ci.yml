name: Physical Art V1 — API security and frontend typecheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/access-api/**'
      - 'apps/frontend/src/components/PhysicalWorkFlowPanel.tsx'
      - 'apps/frontend/src/pages/RwaCatalogPage.tsx'
      - '.github/workflows/physical-art-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-access-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - name: Locked backend dependencies (strict, PR #274)
        working-directory: services/access-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Shopify HMAC, physical custody and wallet security
        working-directory: services/access-api
        run: npm test
  physical-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Locked frontend dependencies
        working-directory: apps/frontend
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: TypeScript baseline assessment (new RWA files must have zero TS errors)
        working-directory: apps/frontend
        run: |
          set +e
          npm run typecheck > /tmp/xartists-tsc.log 2>&1
          status=$?
          set -e
          grep -E 'src/(components/PhysicalWorkFlowPanel|pages/RwaCatalogPage)\\.tsx.*error TS[0-9]+' /tmp/xartists-tsc.log > /tmp/rwa-ts-errors.log || true
          if [ -s /tmp/rwa-ts-errors.log ]; then
            cat /tmp/rwa-ts-errors.log
            echo "::error title=RWA type errors::New physical-art components have TypeScript errors."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            count=$(grep -c 'error TS[0-9]' /tmp/xartists-tsc.log || true)
            echo "::warning title=Frontend preexisting TypeScript debt::Global typecheck failed with $count errors outside the new RWA files. Full strict typecheck is NOT green."
            echo "New RWA files have no TypeScript errors in this run."
          fi
      - name: Production frontend build
        working-directory: apps/frontend
        run: npm run build
