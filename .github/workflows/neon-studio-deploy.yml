name: Studio Neon — deploy disabled (operator only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-neon-first-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: studio-neon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --omit=dev --prefix services/access-api
      - run: node --test deploy/neon/studio/handler.test.mjs
      - run: python3 scripts/ops/package-neon-studio.py
      - run: python3 scripts/ops/deploy-neon-studio.py dist/neon-studio.zip --expected-source "$GITHUB_SHA"
      - name: First deployment only; uploads and commerce remain off
        env:
          NEON_API_KEY: ${{ secrets.NEON_STUDIO_API_KEY }}
        run: python3 scripts/ops/deploy-neon-studio.py dist/neon-studio.zip --expected-source "$GITHUB_SHA" --deploy-disabled
