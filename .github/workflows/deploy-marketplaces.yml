name: Deploy marketplaces

# Build + deploy nft-marketplace then agents-marketplace (fee_bps=300).
# Secret: SC_DEPLOYER_PEM
# Mainnet requires confirm_mainnet=DEPLOY_MAINNET
# Does NOT set VITE_*_CODEHASH_OK — verify explorer first.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "D=devnet, 1=mainnet"
        required: true
        default: "1"
        type: choice
        options:
          - "D"
          - "1"
      confirm_mainnet:
        description: "Mainnet only — type exactly DEPLOY_MAINNET"
        required: false
        default: ""
        type: string
      fee_bps:
        description: "Protocol fee bps (seller gets 10000-fee-royalty; max 1000)"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-marketplaces-${{ github.event.inputs.chain }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHAIN_ID: ${{ github.event.inputs.chain }}
      FEE_BPS: ${{ github.event.inputs.fee_bps }}
      SC_DEPLOYER_PEM: ${{ secrets.SC_DEPLOYER_PEM }}

    steps:
      - uses: actions/checkout@v4

      - name: Mainnet hard gate
        run: |
          set -euo pipefail
          if [ "${CHAIN_ID}" = "1" ]; then
            if [ "${{ github.event.inputs.confirm_mainnet }}" != "DEPLOY_MAINNET" ]; then
              echo "MAINNET BLOCKED — confirm_mainnet=DEPLOY_MAINNET required"
              exit 1
            fi
          fi

      - name: Resolve proxy
        run: |
          if [ "${CHAIN_ID}" = "1" ]; then
            echo "PROXY=https://gateway.multiversx.com" >> "$GITHUB_ENV"
          else
            echo "PROXY=https://devnet-gateway.multiversx.com" >> "$GITHUB_ENV"
          fi

      - name: Check + write PEM
        run: |
          set -euo pipefail
          if [ -z "${SC_DEPLOYER_PEM:-}" ]; then
            echo "SC_DEPLOYER_PEM missing"
            exit 1
          fi
          umask 077
          printf '%s\n' "$SC_DEPLOYER_PEM" > "${RUNNER_TEMP}/deployer.pem"
          if ! grep -q "BEGIN" "${RUNNER_TEMP}/deployer.pem"; then
            HEX=$(tr -d '\n' < "${RUNNER_TEMP}/deployer.pem")
            {
              echo "-----BEGIN PRIVATE KEY for deployer-----"
              echo "$HEX" | fold -w 64
              echo "-----END PRIVATE KEY for deployer-----"
            } > "${RUNNER_TEMP}/deployer.pem"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mxpy
        run: |
          pip install --upgrade pip
          pip install multiversx-sdk-cli
          mxpy --version

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Install sc-meta
        run: |
          rustup target add wasm32v1-none
          cargo install multiversx-sc-meta --locked --force

      - name: Build nft-marketplace
        working-directory: contracts/nft-marketplace
        run: |
          set -euo pipefail
          sc-meta all build
          WASM=$(find . -name 'nft-marketplace*.wasm' -o -name '*.wasm' | head -1)
          test -n "$WASM"
          echo "NFT_WASM=${PWD}/${WASM#./}" >> "$GITHUB_ENV"
          echo "nft wasm: $WASM ($(wc -c < "$WASM") bytes)"

      - name: Deploy nft-marketplace
        id: nft
        run: |
          set -euo pipefail
          NONCE=$(curl -s "https://api.multiversx.com/accounts/erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          echo "nonce=$NONCE fee_bps=$FEE_BPS"
          LOG=$(mxpy contract deploy \
            --bytecode="${NFT_WASM}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --gas-limit=60000000 \
            --proxy="${PROXY}" \
            --chain="${CHAIN_ID}" \
            --nonce="$NONCE" \
            --arguments "${FEE_BPS}" \
            --send \
            --wait-result 2>&1) || true
          echo "$LOG"
          ADDR=$(echo "$LOG" | grep -oE 'erd1qqqq[a-z0-9]+' | head -1 || true)
          echo "nft_address=${ADDR}" >> "$GITHUB_OUTPUT"
          echo "NFT_SC=${ADDR}" >> "$GITHUB_ENV"
          if [ -z "${ADDR}" ]; then
            echo "nft deploy failed or address not parsed"
            exit 1
          fi
          echo "NFT marketplace: $ADDR"

      - name: Build agents-marketplace
        working-directory: contracts/agents-marketplace
        run: |
          set -euo pipefail
          sc-meta all build
          WASM=$(find . -name 'agents-marketplace*.wasm' -o -name '*.wasm' | head -1)
          test -n "$WASM"
          echo "AGENTS_WASM=${PWD}/${WASM#./}" >> "$GITHUB_ENV"
          echo "agents wasm: $WASM ($(wc -c < "$WASM") bytes)"

      - name: Deploy agents-marketplace
        id: agents
        run: |
          set -euo pipefail
          NONCE=$(curl -s "https://api.multiversx.com/accounts/erd1kex0pvp9dng8j76sgsejkyx86nhxuqk24my6wnha8dga9mymvhxqvl8v0g" | python3 -c "import sys,json; print(json.load(sys.stdin).get('nonce',0))")
          LOG=$(mxpy contract deploy \
            --bytecode="${AGENTS_WASM}" \
            --pem="${RUNNER_TEMP}/deployer.pem" \
            --gas-limit=60000000 \
            --proxy="${PROXY}" \
            --chain="${CHAIN_ID}" \
            --nonce="$NONCE" \
            --arguments "${FEE_BPS}" \
            --send \
            --wait-result 2>&1) || true
          echo "$LOG"
          ADDR=$(echo "$LOG" | grep -oE 'erd1qqqq[a-z0-9]+' | head -1 || true)
          echo "agents_address=${ADDR}" >> "$GITHUB_OUTPUT"
          if [ -z "${ADDR}" ]; then
            echo "agents deploy failed or address not parsed"
            exit 1
          fi
          echo "Agents marketplace: $ADDR"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- nft-marketplace: ${NFT_SC:-?}" >> "$GITHUB_STEP_SUMMARY"
          echo "- agents-marketplace: ${{ steps.agents.outputs.agents_address }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- fee_bps: ${FEE_BPS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: verify codeHash · VITE_*_ADDRESS · no CODEHASH_OK until match"

      - name: Cleanup PEM
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.pem"
