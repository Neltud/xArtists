name: 🚀 Deploy xArtists dApp to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'docs/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: 🏗️ Build React app
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /xArtists/
          VITE_MVX_API: https://api.multiversx.com
          # Protocol LIA ops wallet — NOT the end-user session wallet
          VITE_LIA_PROTOCOL_WALLET: erd1p4zyy5476u5nkw4hprhk6dh63znvksm4ppkxglxqasz2kum0lerqu0crn6
          VITE_WALLET: erd1p4zyy5476u5nkw4hprhk6dh63znvksm4ppkxglxqasz2kum0lerqu0crn6

      - name: 🧹 Prepare docs/
        run: |
          mkdir -p docs
          find docs -type f \( -name '*.js' -o -name '*.css' -o -name 'index.html' -o -name '*.svg' -o -name '*.map' \) -delete 2>/dev/null || true
          rm -rf docs/assets 2>/dev/null || true

      - name: 📋 Copy dist/ → docs/
        run: |
          cp -r apps/frontend/dist/. docs/
          touch docs/.nojekyll

      - name: 📊 Copy data JSON
        run: |
          mkdir -p docs/data
          cp -r data/. docs/data/ 2>/dev/null || true

      - name: 🔍 Verify build
        run: |
          test -f docs/index.html && echo "index.html OK" || (echo "MISSING index.html"; exit 1)

      - name: 📤 Commit & Push docs/
        run: |
          git config user.name 'LIA v6 Bot'
          git config user.email 'lia@xartists.io'
          git add docs/
          git diff --staged --quiet || git commit -m "🤖 deploy: xArtists SPA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 🌐 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
