name: 🚀 Deploy xArtists dApp to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'docs/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: 🗜️ Slim NFT catalog (~280KB → ~72KB)
        run: |
          if [ -f data/xartists_collections.json ] && [ ! -f data/xartists_collections.full.json ]; then
            cp data/xartists_collections.json data/xartists_collections.full.json || true
          fi
          if [ -f apps/frontend/public/data/xartists_collections.json ] && [ ! -f data/xartists_collections.full.json ]; then
            cp apps/frontend/public/data/xartists_collections.json data/xartists_collections.full.json || true
          fi
          node scripts/slim_collections.mjs || echo "WARN slim skipped"

      - name: 📋 Ensure critical public data seeds
        run: |
          mkdir -p apps/frontend/public/data docs/data
          for f in lia_board.json lia_v6_status.json contracts.json lia_trades.json \
                   lia_trailing_state.json lia_portfolio.json hatom_lia.json \
                   greensmoke_top.json ads_active.json config.json \
                   xartists_collections.index.json; do
            if [ -f "data/$f" ]; then
              cp -f "data/$f" "apps/frontend/public/data/$f"
              cp -f "data/$f" "docs/data/$f"
              echo "seeded $f"
            fi
          done

      - name: 🏗️ Build React app
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /xArtists/
          VITE_MVX_API: https://api.multiversx.com
          VITE_LIA_PROTOCOL_WALLET: erd1p4zyy5476u5nkw4hprhk6dh63znvksm4ppkxglxqasz2kum0lerqu0crn6
          VITE_WALLET: erd1p4zyy5476u5nkw4hprhk6dh63znvksm4ppkxglxqasz2kum0lerqu0crn6

      - name: 🧹 Prepare docs/
        run: |
          mkdir -p docs
          find docs -type f \( -name '*.js' -o -name '*.css' -o -name 'index.html' -o -name '*.svg' -o -name '*.map' \) -delete 2>/dev/null || true
          rm -rf docs/assets 2>/dev/null || true

      - name: 📋 Copy dist/ → docs/
        run: |
          cp -r apps/frontend/dist/. docs/
          touch docs/.nojekyll

      - name: 📊 Copy data JSON (critical + full data/)
        run: |
          mkdir -p docs/data docs/data/collections
          cp -r data/. docs/data/ 2>/dev/null || true
          cp -r apps/frontend/public/data/. docs/data/ 2>/dev/null || true
          # Explicit board (never 404 after deploy)
          test -f docs/data/lia_board.json && echo "lia_board OK" || echo "WARN missing lia_board"
          test -f docs/data/xartists_collections.index.json && echo "index OK" || true

      - name: 🔍 Verify build
        run: |
          test -f docs/index.html && echo "index.html OK" || (echo "MISSING index.html"; exit 1)

      - name: 📤 Commit & Push docs/
        run: |
          git config user.name 'LIA v6 Bot'
          git config user.email 'lia@xartists.io'
          git add docs/
          git diff --staged --quiet || git commit -m "🤖 deploy: xArtists SPA $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: 🌐 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
