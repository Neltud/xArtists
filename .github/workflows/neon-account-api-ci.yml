name: Neon account API — isolated sandbox contract
on:
  pull_request:
    paths:
      - 'deploy/neon/accounts/**'
      - 'services/access-api/src/neonAccountApi.mjs'
      - 'services/access-api/src/accountRepository.mjs'
      - 'services/access-api/src/accountTypes.mjs'
      - 'services/access-api/src/neonAuthIdentity.mjs'
      - 'services/access-api/src/walletless*.mjs'
      - 'services/access-api/migrations/20261109_xa_accounts_v1.sql'
      - 'services/access-api/tests/neonAccountApi*.test.mjs'
      - 'services/access-api/tests/fixtures/neon-account-fixture.mjs'
      - 'scripts/ops/probe-neon-accounts-off.mjs'
      - 'tests/probe-neon-accounts-off.test.mjs'
      - '.github/workflows/neon-account-api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/neon/accounts/**'
      - 'services/access-api/src/neonAccountApi.mjs'
      - 'services/access-api/src/accountRepository.mjs'
      - 'services/access-api/src/accountTypes.mjs'
      - 'services/access-api/src/neonAuthIdentity.mjs'
      - 'services/access-api/src/walletless*.mjs'
      - 'services/access-api/migrations/20261109_xa_accounts_v1.sql'
      - 'services/access-api/tests/neonAccountApi*.test.mjs'
      - 'services/access-api/tests/fixtures/neon-account-fixture.mjs'
      - 'scripts/ops/probe-neon-accounts-off.mjs'
      - 'tests/probe-neon-accounts-off.test.mjs'
      - '.github/workflows/neon-account-api-ci.yml'
permissions:
  contents: read
jobs:
  account-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xartists_account_probe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d xartists_account_probe"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/access-api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/access-api
      - name: JWT, exact target, CORS, no anonymous SQL, all commercial gates closed
        run: node --test services/access-api/tests/neonAccountApi.test.mjs tests/probe-neon-accounts-off.test.mjs
      - name: Session idempotency and cross-account isolation on disposable PostgreSQL
        env:
          ALLOW_EPHEMERAL_XA_ACCOUNT_PG_TEST: '1'
          TEST_XA_ACCOUNT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xartists_account_probe
        run: node --test services/access-api/tests/neonAccountApiPostgres.test.mjs
