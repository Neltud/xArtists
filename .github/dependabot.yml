version: 2
updates:
  # NPM dependencies (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 6

    versioning-strategy: "increase"

    # Majors that break build/CSS/lint without a dedicated migration PR
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    commit-message-prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "dependabot"

  # Frontend package (if present as separate ecosystem)
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    open-pull-requests-limit: 4
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    commit-message-prefix: "chore(deps-frontend):"
    labels:
      - "dependencies"
      - "dependabot"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message-prefix: "ci(deps):"
    labels:
      - "dependencies"
      - "github-actions"
