---
# xArtists NFT / collections indexer on Akash
# 1) Build & push image (see README)
# 2) Deploy this SDL in Akash Console (same flow as Hello World)
# 3) Point VITE_CATALOG_API at the public ingress URL

version: "2.0"

services:
  xartists-indexer:
    image: ghcr.io/neltud/xartists-indexer:latest
    env:
      - NODE_ENV=production
      - PORT=8080
      - MVX_API=https://api.multiversx.com
      - COLLECTIONS=NFTUDURI-2990b6,TRO-652d6d,XTR-e5072b,XAR-cee2e0
      - POLL_INTERVAL_SEC=120
      - CORS_ORIGIN=https://neltud.github.io
    expose:
      - port: 8080
        as: 80
        to:
          - global: true

profiles:
  compute:
    xartists-indexer:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    akash:
      pricing:
        xartists-indexer:
          denom: uakt
          amount: 10000

deployment:
  xartists-indexer:
    akash:
      profile: xartists-indexer
      count: 1
