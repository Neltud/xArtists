---
# xArtists NFT / collections indexer worker on Akash Network
# Deploy: https://console.akash.network  ·  or `provider-services tx deployment create`
# Secrets: never bake PEM / API keys into the image — use env vars at deploy time.

version: "2.0"

services:
  xartists-indexer:
    image: ghcr.io/neltud/xartists-indexer:latest
    # Fallback public image until custom image is published:
    # image: node:20-alpine
    env:
      - NODE_ENV=production
      - PORT=8080
      - MVX_API=https://api.multiversx.com
      - COLLECTIONS=NFTUDURI-2990b6,TRO-652d6d,XTR-e5072b,XAR-cee2e0
      - POLL_INTERVAL_SEC=120
      - CORS_ORIGIN=https://neltud.github.io
      # Optional: push snapshot to object storage / webhook
      # - WEBHOOK_URL=
      # - IPFS_API=
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
        accept:
          - indexer.xartists.example
    # If using node:20-alpine without custom image, override command:
    # command:
    #   - sh
    #   - -c
    #   - "npm i -g xartists-indexer@latest && xartists-indexer"

profiles:
  compute:
    xartists-indexer:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    akash:
      pricing:
        xartists-indexer:
          denom: uakt
          amount: 10000

deployment:
  xartists-indexer:
    akash:
      profile: xartists-indexer
      count: 1
