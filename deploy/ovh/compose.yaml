# Parallel, non-commercial OVH API deployment. No migration or wallet action at startup.
name: xartists-api-ovh

services:
  api:
    build:
      context: ../..
      dockerfile: services/access-api/Dockerfile
    env_file:
      - .env.api
    environment:
      NODE_ENV: production
      PORT: "8787"
      REQUIRE_SIWX: "1"
      MINT_LIVE_ENABLED: "0"
      MINT_DRY_RUN: "1"
      CREATOR_MEDIA_UPLOAD_ENABLED: "0"
      STUDIO_GLB_UPLOAD_ENABLED: "0"
      STRIPE_LIVE_CHECKOUT_ENABLED: "0"
      PAYBOX_CHECKOUT_ENABLED: "0"
      LIA_LIVE_TRADING: "0"
    expose:
      - "8787"
    networks:
      - internal
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?Set API_HOSTNAME to the exact operator-controlled DNS host}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
