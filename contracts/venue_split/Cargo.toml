[package]
name = "venue-split"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
# rlib required so meta can link AbiProvider; cdylib for wasm output
crate-type = ["cdylib", "rlib"]

[dependencies]
multiversx-sc = "0.66.2"

[dev-dependencies]
multiversx-sc-scenario = "0.66.2"

# Local workspace (repo root excludes this path)
[workspace]
members = [
    ".",
    "meta",
]
