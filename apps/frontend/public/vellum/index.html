<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#161020" />
  <meta name="description" content="État de la console Vellum xArtists." />
  <title>Console Vellum retirée · xArtists</title>
  <style>
    :root{color-scheme:dark;--bg:#161020;--panel:#21182e;--line:#46355e;--text:#f4efff;--muted:#c9bddc;--accent:#c4a4ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
    main{max-width:640px;margin:auto;padding:clamp(24px,7vw,72px) 20px}
    .brand{font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
    h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.15;margin:1rem 0}
    p{color:var(--muted)}section{border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--panel)}
    a{display:inline-flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:650;text-decoration:none}
    a:focus-visible{outline:2px solid white;outline-offset:4px}
    .links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}
  </style>
</head>
<body>
  <main>
    <p class="brand">xArtists · Vellum</p>
    <section aria-labelledby="status">
      <h1 id="status">Console Vellum retirée</h1>
      <p>La console publique est indisponible. Vellum reste une couche d’abstraction interne, en cours de validation.</p>
      <p>Aucune intention n’est analysée sur cette page. Aucune signature, exécution ou opération financière n’est proposée.</p>
      <nav class="links" aria-label="Retour à xArtists">
        <a href="../">Retour à xArtists</a>
        <a class="secondary" href="../studio/">Studio</a>
      </nav>
    </section>
  </main>
</body>
</html>
